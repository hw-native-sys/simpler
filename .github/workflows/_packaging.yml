name: Packaging Matrix

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      repository:
        required: false
        type: string
      ref:
        required: false
        type: string
      runs_on:
        required: true
        type: string
      setup_variant:
        description: github or self-cpu.
        required: true
        type: string
      python_version:
        required: false
        default: "3.10"
        type: string

jobs:
  run:
    name: packaging
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    timeout-minutes: 60
    steps:
      - name: Checkout target
        uses: actions/checkout@v5
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Set up C++ compiler
        id: packaging-tools
        if: inputs.setup_variant == 'github'
        run: |
          # ninja arrives from PyPI with the venv, so the only package a
          # packaging build cannot proceed without is a host compiler. ccache
          # merely warms the matrix's later modes and the matrix step already
          # runs without it, so a package manager that cannot serve it is a
          # warning, not a failure.
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            required_packages=()
            if ! command -v gcc >/dev/null 2>&1 || ! command -v g++ >/dev/null 2>&1; then
              required_packages+=(g++)
            fi
            optional_packages=()
            command -v ccache >/dev/null 2>&1 || optional_packages+=(ccache)
            echo "required-packages=${required_packages[*]}" >> "$GITHUB_OUTPUT"
            echo "optional-packages=${optional_packages[*]}" >> "$GITHUB_OUTPUT"
          else
            if ! command -v ccache >/dev/null 2>&1; then
              brew install ccache ||
                echo "::warning::brew could not install ccache; continuing without it"
            fi
            if ! command -v gcc-15 >/dev/null 2>&1 || ! command -v g++-15 >/dev/null 2>&1; then
              brew install gcc@15 || brew install gcc
            fi
          fi

      - name: Install Linux C++ compiler tools
        if: inputs.setup_variant == 'github' && runner.os == 'Linux' && (steps.packaging-tools.outputs.required-packages != '' || steps.packaging-tools.outputs.optional-packages != '')
        uses: ./.github/actions/apt-install
        with:
          required-packages: ${{ steps.packaging-tools.outputs.required-packages }}
          optional-packages: ${{ steps.packaging-tools.outputs.optional-packages }}
          install-timeout-seconds: "240"

      - name: Set up Python ${{ inputs.python_version }}
        if: inputs.setup_variant == 'github'
        uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python_version }}

      - name: Cache pip packages
        if: inputs.setup_variant == 'self-cpu'
        uses: ./.github/actions/cache-pip

      - name: Install build + runtime deps in venv
        uses: ./.github/actions/setup-venv
        with:
          packages: "scikit-build-core>=0.10.0 nanobind>=2.0.0,<3 cmake>=3.20 ninja>=1.11 pytest>=6.0"

      - name: Run packaging matrix
        run: |
          . .venv/bin/activate
          if [[ -z "${CC:-}" && -z "${CXX:-}" ]]; then
            # Use the unversioned platform-default compilers intentionally (Apple
            # Clang on current macOS runners), not versioned Homebrew GCC. Absolute
            # paths keep the compiler identity stable across packaging modes.
            if CC="$(command -v gcc)" && CXX="$(command -v g++)"; then
              export CC CXX
              echo "Resolved platform compilers: CC=$CC CXX=$CXX"
              "$CC" --version
              "$CXX" --version
            else
              echo "::error::gcc/g++ not found on PATH; runner provisioning is incomplete"
              exit 1
            fi
          fi
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            export MACOSX_DEPLOYMENT_TARGET
            MACOSX_DEPLOYMENT_TARGET="$(sw_vers -productVersion | cut -d. -f1,2)"
          fi
          if command -v ccache >/dev/null 2>&1; then
            export CCACHE_DIR="$RUNNER_TEMP/simpler-packaging-ccache"
            # Keep one cold build per job while reusing identical objects
            # across the remaining clean-install modes.
            if ccache --clear && ccache --max-size=1G && ccache --zero-stats; then
              export CMAKE_C_COMPILER_LAUNCHER=ccache
              export CMAKE_CXX_COMPILER_LAUNCHER=ccache
              trap 'ccache --show-stats || true' EXIT
            else
              unset CCACHE_DIR
              echo "::warning::ccache initialization failed; running without compiler cache"
            fi
          else
            echo "::notice::ccache not found; running packaging matrix without compiler cache"
          fi
          bash tools/verify_packaging.sh
