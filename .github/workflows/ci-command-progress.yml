name: CI Command Progress

on:
  workflow_dispatch:
    inputs:
      command:
        description: Command that started the run
        type: choice
        options: [a5, a3-network1]
        default: a5
      run_id:
        description: Existing command CI run to monitor (does not rerun tests)
        type: string
        required: true
  workflow_run:
    workflows: [CI A5 Comment, CI A3 Network1]
    types: [in_progress, completed]

permissions: {}

env:
  CI_COMMAND: ${{ inputs.command || (github.event.workflow_run.name == 'CI A3 Network1' && 'a3-network1' || 'a5') }}

jobs:
  route:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.event == 'workflow_dispatch' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      key: ${{ steps.route.outputs.key }}
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout trusted progress router
        uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
          sparse-checkout: |
            .github/scripts
            .github/ci-commands.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Validate the PR commit before joining the writer queue
        id: route
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/ci_progress.py route

  progress:
    needs: route
    if: needs.route.outputs.key != ''
    runs-on: ubuntu-latest
    timeout-minutes: 310
    concurrency:
      # All runs/attempts for this PR commit update the same status contexts.
      # Serialize their writers; after acquiring the slot, an obsolete monitor
      # revalidates the source and exits before it can overwrite a newer result.
      group: ci-command-progress-${{ needs.route.outputs.key }}
      queue: max
      cancel-in-progress: false
    permissions:
      contents: read
      actions: write
      pull-requests: read
      statuses: write
    steps:
      - name: Checkout trusted progress publisher
        uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
          sparse-checkout: |
            .github/scripts
            .github/ci-commands.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Mirror test jobs onto the PR
        id: monitor
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/ci_progress.py
      - name: Reconcile the command status after monitoring
        if: always() && steps.monitor.outputs.source_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ steps.monitor.outputs.source_run }}
        run: >-
          gh workflow run ci-command-status.yml --repo "$GITHUB_REPOSITORY" --ref main
          -f command="$CI_COMMAND" -f run_id="$SOURCE_RUN"
