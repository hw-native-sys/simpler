name: NPU DeepSeek Smokes (a2a3)

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      repository:
        required: false
        type: string
      ref:
        required: false
        type: string
      runs_on:
        required: true
        type: string

jobs:
  run:
    name: st-deepseek-onboard-a2a3
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    timeout-minutes: 30
    env:
      SIMPLER_SCHEDULER_TIMEOUT_MS: "10000"
      SIMPLER_OP_EXECUTE_TIMEOUT_US: "45000000"
      SIMPLER_STREAM_SYNC_TIMEOUT_MS: "50000"
    steps:
      - name: Checkout target
        uses: actions/checkout@v5
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      # Own key family, separate from _st-npu-a2a3.yml's: the main sweep
      # compiles with --manual exclude and never builds these kernels, while
      # this job compiles only the two DS directories. Sharing the main key
      # would let this partial compilation win the immutable-cache save race
      # and starve the main sweep's cache.
      - name: Restore scene-test kernel cache (a2a3)
        uses: actions/cache@v5
        with:
          path: build/cache/kernels
          key: scene-kernels-a2a3-ds-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pto_isa.pin') }}-${{ inputs.ref || github.sha }}
          restore-keys: |
            scene-kernels-a2a3-ds-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pto_isa.pin') }}-

      - name: Set up environment
        uses: ./.github/actions/setup-venv
        with:
          build-packages: "scikit-build-core nanobind<3 cmake>=3.20"
          packages: "--no-build-isolation --config-settings=build.targets=build_package_a2a3 .[test]"
          install-torch: "false"
          system-site-packages: "true"
          source-cann: "true"

      - name: Compile DeepSeek kernels (a2a3)
        run: |
          source /usr/local/Ascend/cann/set_env.sh
          # discover_runtimes is the one definition of what a runtime is — a
          # directory under src/<arch>/runtime with a build_config.py — so a new
          # one is compiled here without editing this list into existence. An
          # empty result would make the loop body run zero times and the step
          # pass having compiled nothing, which `set -e` does not catch in a
          # `for` list, so it is rejected before the loop.
          runtimes=$(.venv/bin/python -c \
              "from simpler_setup.platform_info import discover_runtimes; print(' '.join(discover_runtimes('a2a3')))")
          test -n "$runtimes"
          for runtime in $runtimes; do
            .venv/bin/python "examples/a2a3/$runtime/deepseek_v4_flash_decode/main.py" \
              --platform a2a3 --compile-only --compile-workers 8
          done

      # The DS cases are the only manual tests under these two directories, so
      # --manual only selects exactly the two smoke tests. They stay manual:
      # the main sweep runs --manual exclude and must not adopt them back.
      # Each case needs 2 devices (EP world size); 4 devices let both run
      # concurrently.
      - name: Run DeepSeek pytest smokes (a2a3)
        run: |
          source /usr/local/Ascend/cann/set_env.sh
          DS_TESTS="examples/a2a3/host_build_graph/deepseek_v4_flash_decode examples/a2a3/tensormap_and_ringbuffer/deepseek_v4_flash_decode"
          task-submit --timeout 1800 --max-time 1800 --device auto --device-num 4 \
            --run ".venv/bin/python -m pytest $DS_TESTS -m 'not sdma' --platform a2a3 --exclude-level 4 --manual only --device \$TASK_DEVICE -v --require-pto-isa --pto-session-timeout 1200"
