name: NPU Unit Tests (a5)

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      repository:
        required: false
        type: string
      ref:
        required: false
        type: string
      runs_on:
        required: true
        type: string
      run_hardware:
        description: Run tests that allocate A5 devices.
        type: boolean
        default: true
      run_sdk:
        description: Run CPU tests that require the A5 CANN SDK.
        type: boolean
        default: true
      include_cann_examples:
        required: false
        default: false
        type: boolean

jobs:
  run:
    name: ut-a5
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    timeout-minutes: 60
    env:
      SIMPLER_SCHEDULER_TIMEOUT_MS: "2000"
      SIMPLER_OP_EXECUTE_TIMEOUT_US: "3000000"
      SIMPLER_STREAM_SYNC_TIMEOUT_MS: "6000"
    steps:
      - name: Checkout target
        uses: actions/checkout@v5
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Set up environment
        id: setup
        uses: ./.github/actions/setup-venv
        with:
          build-packages: "scikit-build-core nanobind<3 cmake>=3.20"
          packages: "--no-build-isolation --config-settings=build.targets=build_package_a5 .[test]"
          install-torch: "false"
          system-site-packages: "true"
          source-cann: "true"

      - name: Run SDK Python unit tests on the host (a5)
        id: sdk_py
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && inputs.run_sdk }}
        run: |
          source /usr/local/Ascend/cann/set_env.sh
          .venv/bin/python -m pytest tests/ut -m requires_toolkit --ut-arches a5 -q

      - name: Build and run SDK C++ unit tests on the host (a5)
        id: sdk_cpp
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && inputs.run_sdk && hashFiles('tests/ut/cpp/a5/toolkit/**/test_*.cpp') != '' }}
        run: |
          source /usr/local/Ascend/cann/set_env.sh
          source .venv/bin/activate
          cmake -B build/ut-toolkit -S tests/ut/cpp -DSIMPLER_ENABLE_TOOLKIT_TESTS=ON -DSIMPLER_ENABLE_HARDWARE_TESTS=OFF
          cmake --build build/ut-toolkit --target ut_toolkit_a5
          ctest --test-dir build/ut-toolkit -L '^requires_toolkit$' -L '^ut_a5$' \
            --output-on-failure --timeout 300 --no-tests=error

      - name: Build hardware C++ unit tests (a5)
        id: hardware_cpp
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && inputs.run_hardware && hashFiles('tests/ut/cpp/a5/hardware/**/test_*.cpp') != '' }}
        run: |
          source /usr/local/Ascend/cann/set_env.sh
          source .venv/bin/activate
          cmake -B build/ut-hardware -S tests/ut/cpp -DSIMPLER_ENABLE_HARDWARE_TESTS=ON -DSIMPLER_ENABLE_TOOLKIT_TESTS=OFF
          cmake --build build/ut-hardware --target ut_hardware_a5

      - name: Run hardware unit tests (a5)
        id: hardware
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && inputs.run_hardware }}
        env:
          RUN_CPP: ${{ steps.hardware_cpp.outcome == 'success' }}
        run: |
          source /usr/local/Ascend/cann/set_env.sh
          source .venv/bin/activate
          task-submit --timeout 3600 --max-time 1800 --device auto --device-num "$DEVICE_NUM" \
            --run "bash tools/run_hardware_ut.sh a5 $RUN_CPP"

      # Every tool under tools/cann-examples, discovered rather than named, and
      # each one smoke-run on a locked device via its own smoke.sh. The by-name
      # list this replaces grew one entry per rot incident, so a tool nobody had
      # listed was a tool nobody compiled: aicore-notification-perf had stopped
      # building on CANN 9.x (#2333) and aicpu-mmio-probes was failing to link,
      # both unnoticed. Adding a tool now needs no workflow edit, and a tool that
      # builds but cannot run is a failure rather than a silent pass.
      - name: Build and smoke-run tools/cann-examples (a5)
        id: smoke
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && inputs.run_hardware && inputs.include_cann_examples }}
        run: |
          source /usr/local/Ascend/cann/set_env.sh
          task-submit --timeout 3600 --max-time 1800 --device auto --device-num 1 \
            --run "tools/build_cann_examples.sh dav-c310-cube --run \$TASK_DEVICE"
