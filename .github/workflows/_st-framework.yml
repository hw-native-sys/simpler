name: Framework Scene Tests

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      repository:
        required: false
        type: string
      ref:
        required: false
        type: string
      platform:
        required: true
        type: string
      runs_on:
        required: true
        type: string
      manual_mode:
        required: false
        type: string
        default: exclude

jobs:
  run:
    name: st-framework-${{ inputs.platform }}
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    timeout-minutes: 45
    env:
      TORCH_DEVICE_BACKEND_AUTOLOAD: "0"
      SIMPLER_SCHEDULER_TIMEOUT_MS: "2000"
      SIMPLER_OP_EXECUTE_TIMEOUT_US: "3000000"
      SIMPLER_STREAM_SYNC_TIMEOUT_MS: "6000"
    steps:
      - name: Checkout target
        uses: actions/checkout@v5
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Set up framework environment
        id: framework
        uses: ./.github/actions/setup-framework
        with:
          platform: ${{ inputs.platform }}

      - name: Run the declared framework environment exclusively
        env:
          CANN_ENV: ${{ steps.framework.outputs.cann_env }}
          MANUAL_MODE: ${{ inputs.manual_mode }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          case "$MANUAL_MODE" in
            exclude|include|only) ;;
            *) echo "::error::manual_mode must be exclude, include, or only"; exit 1 ;;
          esac
          case "$PLATFORM" in
            a2a3|a5) ;;
            *) echo "::error::platform must be a2a3 or a5"; exit 1 ;;
          esac
          source "$CANN_ENV"
          mkdir -p outputs/framework-ci
          git rev-parse HEAD | tee outputs/framework-ci/source.txt
          task-submit --list
          task-submit --env CANN_ENV --env MANUAL_MODE --env PLATFORM --env PYTEST_ADDOPTS --env FRAMEWORK_WHEEL_SITE --timeout 2100 --max-time 1200 --device auto --device-num 1 \
            --run "source \"\$CANN_ENV\" && \
              export PYTHONPATH=\"\$FRAMEWORK_WHEEL_SITE\${PYTHONPATH:+:\$PYTHONPATH}\" && \
              .claude/skills/onboard-arch-precheck/check.sh \"\$PLATFORM\" && \
              npu-smi info > outputs/framework-ci/npu-smi.txt && \
              .venv-framework/bin/python .github/actions/setup-framework/identity.py --platform \"\$PLATFORM\" && \
              .venv-framework/bin/python -m pytest examples tests/st --platform \"\$PLATFORM\" --test-environment torch_npu --environment-receipts --verify-feature-coverage --coverage-partition all \
              --manual \"\$MANUAL_MODE\" --require-pto-isa --device \$TASK_DEVICE --max-parallel 1 -p no:xdist -v -s \
              --basetemp outputs/framework-ci/pytest --junitxml outputs/framework-ci/results.xml"
          .venv-framework/bin/python -m simpler_setup.test_environments verify outputs/framework-ci/results.plan.json outputs/framework-ci/results.xml

      - name: Verify and summarize torch_npu environment coverage
        if: always()
        env:
          PLATFORM: ${{ inputs.platform }}
          MANUAL_MODE: ${{ inputs.manual_mode }}
        run: |
          .venv-framework/bin/python -m simpler_setup.tools.feature_coverage_report \
            --root outputs/framework-ci --environment torch_npu --platform "$PLATFORM" --manual "$MANUAL_MODE"

      - name: Checkout diagnostic upload action
        id: diagnostics
        if: always()
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.workflow_sha }}
          path: .ci-support
          sparse-checkout: .github/actions/upload-diagnostics
          fetch-depth: 1
          persist-credentials: false

      - name: Retain framework identities and logs
        if: always() && steps.diagnostics.outcome == 'success'
        # The test result is already checked above; artifact service failures only lose diagnostics.
        continue-on-error: true
        uses: ./.ci-support/.github/actions/upload-diagnostics
        with:
          name: framework-${{ inputs.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            outputs/framework-ci
            !outputs/framework-ci/pytest/framework-eager-module*/**
          if-no-files-found: warn
