name: CI

permissions:
  contents: read
  pull-requests: read

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  framework-a3:
    strategy:
      fail-fast: false
      matrix:
        slot: [1, 2, 3, 4]
    uses: ./.github/workflows/_st-framework-eager.yml
    with:
      platform: a2a3
      runs_on: '["self-hosted","a2a3"]'

  onboard-st-a3:
    strategy:
      fail-fast: false
      matrix:
        slot: [1, 2, 3, 4]
    uses: ./.github/workflows/_st-npu-a2a3.yml
    with:
      runs_on: '["self-hosted","a2a3"]'
      include_dfx_smokes: true
