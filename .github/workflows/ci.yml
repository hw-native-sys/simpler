name: CI

permissions:
  contents: read
  pull-requests: read

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    uses: ./.github/workflows/_detect-changes.yml
    with:
      repository: ${{ github.event.pull_request.head.repo.full_name }}
      ref: ${{ github.event.pull_request.head.sha }}
      base_repository: ${{ github.event.pull_request.base.repo.full_name }}
      base_ref: ${{ github.event.pull_request.base.ref }}
      base_sha: ${{ github.event.pull_request.base.sha }}
      head_sha: ${{ github.event.pull_request.head.sha }}
      runs_on: '["self-hosted","cpu"]'

  pre-commit:
    uses: ./.github/workflows/_pre-commit.yml
    with:
      base_sha: ${{ github.event.pull_request.base.sha }}
      runs_on: '["self-hosted","cpu"]'

  packaging-matrix:
    needs: [detect-changes, pre-commit]
    if: needs.detect-changes.outputs.non_code_only != 'true' && needs.detect-changes.outputs.examples_only != 'true' && needs.detect-changes.outputs.tests_only != 'true'
    uses: ./.github/workflows/_packaging.yml
    with:
      runs_on: '["self-hosted","cpu"]'
      setup_variant: self-cpu

  ut:
    needs: [detect-changes, pre-commit]
    if: needs.detect-changes.outputs.non_code_only != 'true' && needs.detect-changes.outputs.ut_affected == 'true'
    uses: ./.github/workflows/_ut-no-hardware.yml
    with:
      runs_on: '["self-hosted","cpu"]'
      setup_variant: self-cpu
      ut_arches: ${{ needs.detect-changes.outputs.ut_arches }}

  st-sim-a2a3:
    needs: [detect-changes, pre-commit]
    if: needs.detect-changes.outputs.a2a3_changed == 'true' && needs.detect-changes.outputs.st_affected == 'true'
    uses: ./.github/workflows/_st-sim-a2a3.yml
    with:
      runs_on: '["self-hosted","cpu"]'
      setup_variant: self-cpu
      include_dfx_smokes: true

  st-sim-a5:
    needs: [detect-changes, pre-commit]
    if: needs.detect-changes.outputs.a5_changed == 'true' && needs.detect-changes.outputs.st_affected == 'true'
    uses: ./.github/workflows/_st-sim-a5.yml
    with:
      runs_on: '["self-hosted","cpu"]'
      setup_variant: self-cpu
      include_dfx_smokes: true

  st-sim-wse:
    needs: [detect-changes, pre-commit]
    if: needs.detect-changes.outputs.wse_changed == 'true' && needs.detect-changes.outputs.st_affected == 'true'
    uses: ./.github/workflows/_st-sim-wse.yml
    with:
      runs_on: '["self-hosted","cpu"]'
      setup_variant: self-cpu
      include_dfx_smokes: true

  profiling-flags-smoke:
    needs: [detect-changes, pre-commit]
    if: (needs.detect-changes.outputs.a2a3_changed == 'true' || needs.detect-changes.outputs.a5_changed == 'true') && needs.detect-changes.outputs.examples_only != 'true' && needs.detect-changes.outputs.tests_only != 'true'
    uses: ./.github/workflows/_profiling-flags-smoke.yml
    with:
      runs_on: '["self-hosted","cpu"]'

  ut-a2a3:
    needs: [detect-changes, pre-commit]
    if: needs.detect-changes.outputs.ut_hardware_a2a3 == 'true' || needs.detect-changes.outputs.ut_sdk_a2a3 == 'true'
    uses: ./.github/workflows/_ut-npu-a2a3.yml
    with:
      runs_on: '["self-hosted","a2a3"]'
      include_cann_examples: true
      run_hardware: ${{ needs.detect-changes.outputs.ut_hardware_a2a3 == 'true' }}
      run_sdk: ${{ needs.detect-changes.outputs.ut_sdk_a2a3 == 'true' }}

  ut-a5:
    needs: [detect-changes, pre-commit]
    if: needs.detect-changes.outputs.ut_hardware_a5 == 'true' || needs.detect-changes.outputs.ut_sdk_a5 == 'true'
    uses: ./.github/workflows/_ut-npu-a5.yml
    with:
      runs_on: '["self-hosted","a5"]'
      include_cann_examples: true
      run_hardware: ${{ needs.detect-changes.outputs.ut_hardware_a5 == 'true' }}
      run_sdk: ${{ needs.detect-changes.outputs.ut_sdk_a5 == 'true' }}

  st-framework-a2a3:
    needs: [detect-changes, pre-commit]
    if: needs.detect-changes.outputs.a2a3_changed == 'true' && needs.detect-changes.outputs.st_affected == 'true'
    uses: ./.github/workflows/_st-framework.yml
    with:
      platform: a2a3
      runs_on: '["self-hosted","a2a3"]'

  st-framework-a5:
    needs: [detect-changes, pre-commit]
    if: needs.detect-changes.outputs.a5_changed == 'true' && needs.detect-changes.outputs.st_affected == 'true'
    uses: ./.github/workflows/_st-framework.yml
    with:
      platform: a5
      ref: ${{ github.sha }}
      runs_on: '["self-hosted","a5"]'

  st-onboard-a2a3:
    needs: [detect-changes, pre-commit]
    if: needs.detect-changes.outputs.a2a3_changed == 'true' && needs.detect-changes.outputs.st_affected == 'true'
    uses: ./.github/workflows/_st-npu-a2a3.yml
    with:
      runs_on: '["self-hosted","a2a3"]'

  st-onboard-a5:
    needs: [detect-changes, pre-commit]
    if: needs.detect-changes.outputs.a5_changed == 'true' && needs.detect-changes.outputs.st_affected == 'true'
    uses: ./.github/workflows/_st-npu-a5.yml
    with:
      runs_on: '["self-hosted","a5"]'
      include_dfx_smokes: true

  # Qwen golden checks and DeepSeek smokes stay manual and run in a separate
  # model job, parallel with st-onboard-a2a3. Both jobs use the same gates.
  st-model-onboard-a2a3:
    needs: [detect-changes, pre-commit]
    if: needs.detect-changes.outputs.a2a3_changed == 'true' && needs.detect-changes.outputs.st_affected == 'true'
    uses: ./.github/workflows/_st-model-a2a3.yml
    with:
      runs_on: '["self-hosted","a2a3"]'
