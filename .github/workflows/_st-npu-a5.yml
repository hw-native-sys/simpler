name: NPU Scene Tests (a5)

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      repository:
        required: false
        type: string
      ref:
        required: false
        type: string
      runs_on:
        required: true
        type: string
      include_dfx_smokes:
        required: false
        default: false
        type: boolean
      manual_mode:
        description: exclude for Per-PR, include for the Daily full sweep.
        required: false
        default: exclude
        type: string
      session_timeout_seconds:
        description: >-
          Pytest session timeout in seconds. The default sizes the Per-PR
          sweep; a caller that selects more than that sweep has to raise it
          to match what it selected.
        required: false
        default: 1200
        type: number
      job_timeout_minutes:
        description: >-
          Job timeout in minutes. Has to leave room for the whole queue wait
          below, plus setup and the kernel compile that precede it.
        required: false
        default: 75
        type: number

jobs:
  run:
    name: st-onboard-a5
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    timeout-minutes: ${{ inputs.job_timeout_minutes }}
    env:
      MANUAL_MODE: ${{ inputs.manual_mode }}
      SESSION_TIMEOUT_S: ${{ inputs.session_timeout_seconds }}
      SIMPLER_ENABLE_PTO_URMA_WORKSPACE: "ON"
      SIMPLER_ENABLE_PTO_RDMA_WORKSPACE: "OFF"
      SIMPLER_SCHEDULER_TIMEOUT_MS: "2000"
      SIMPLER_OP_EXECUTE_TIMEOUT_US: "3000000"
      SIMPLER_STREAM_SYNC_TIMEOUT_MS: "6000"
      A5_DIAGNOSTIC_DIR: ${{ github.workspace }}/outputs/a5-onboard-${{ github.run_id }}-${{ github.run_attempt }}
      ASCEND_PROCESS_LOG_PATH: ${{ github.workspace }}/outputs/a5-onboard-${{ github.run_id }}-${{ github.run_attempt }}/ascend
    steps:
      - name: Checkout target
        uses: actions/checkout@v5
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Prepare A5 diagnostic logs
        run: |
          mkdir -p "$ASCEND_PROCESS_LOG_PATH"
          git rev-parse HEAD > "$A5_DIAGNOSTIC_DIR/source.txt"

      - name: Validate manual mode
        run: |
          case "$MANUAL_MODE" in
            exclude|include|only) ;;
            *)
              echo "::error::manual_mode must be exclude, include, or only"
              exit 2
              ;;
          esac

      - name: Restore scene-test kernel cache (a5)
        uses: actions/cache@v5
        with:
          path: build/cache/kernels
          key: scene-kernels-a5-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pto_isa.pin') }}-${{ inputs.ref || github.sha }}
          restore-keys: |
            scene-kernels-a5-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pto_isa.pin') }}-

      - name: Set up environment
        uses: ./.github/actions/setup-venv
        with:
          build-packages: "scikit-build-core nanobind<3 cmake>=3.20"
          packages: "--no-build-isolation --config-settings=build.targets=build_package_a5 .[test]"
          install-torch: "false"
          system-site-packages: "true"
          source-cann: "true"

      - name: Compile scene-test kernels (a5)
        run: |
          source /usr/local/Ascend/cann/set_env.sh
          .venv/bin/python -m simpler_setup.tools.scene_test_compile examples tests/st \
            --platform a5 --exclude-level 4 --require-pto-isa --compile-workers 32 -q \
            --manual "$MANUAL_MODE"

      - name: Compile Qwen standalone kernels (a5)
        if: inputs.manual_mode != 'exclude'
        env:
          TORCH_DEVICE_BACKEND_AUTOLOAD: "0"
        run: |
          source /usr/local/Ascend/cann/set_env.sh
          # discover_runtimes is the one definition of what a runtime is — a
          # directory under src/<arch>/runtime with a build_config.py — so a new
          # one is compiled here without editing this list into existence. An
          # empty result would make the loop body run zero times and the step
          # pass having compiled nothing, which `set -e` does not catch in a
          # `for` list, so it is rejected before the loop.
          runtimes=$(.venv/bin/python -c \
              "from simpler_setup.platform_info import discover_runtimes; print(' '.join(discover_runtimes('a5')))")
          test -n "$runtimes"
          for runtime in $runtimes; do
            .venv/bin/python "examples/a5/$runtime/qwen3_14b_decode/main.py" \
              --platform a5 --compile-only --compile-workers 32
          done

      - name: Run pytest scene tests (a5)
        shell: bash
        run: |
          source /usr/local/Ascend/cann/set_env.sh
          # Three nested budgets, each derived from the one it contains, so
          # that raising the sweep does not silently leave an outer one
          # behind:
          #   --max-time  the run itself, which must outlast the session
          #               budget or the device is reclaimed before pytest can
          #               report its own timeout and name what was stuck;
          #   --timeout   how long the client waits, which covers that run
          #               plus the queue ahead of it on a shared pool.
          # At the default these are the 1800 s and 3300 s this job has been
          # using, and the job's own timeout-minutes has to stay above both.
          MAX_TIME_S=$((SESSION_TIMEOUT_S + 600))
          QUEUE_TIMEOUT_S=$((MAX_TIME_S + 1500))
          task-submit --timeout "$QUEUE_TIMEOUT_S" --max-time "$MAX_TIME_S" --device auto --device-num "$DEVICE_NUM" \
            --env SIMPLER_ENABLE_PTO_URMA_WORKSPACE --env SIMPLER_ENABLE_PTO_RDMA_WORKSPACE \
            --env ASCEND_PROCESS_LOG_PATH \
            --run ".venv/bin/python -m pytest examples tests/st --platform a5 --exclude-level 4 --device \$TASK_DEVICE -v --require-pto-isa --pto-session-timeout $SESSION_TIMEOUT_S --manual '$MANUAL_MODE'" \
            2>&1 | tee "$A5_DIAGNOSTIC_DIR/pytest-task.log"

      - name: Print A5 device diagnostics
        if: always()
        # Device-log transport must preserve the scene-test result.
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import gzip
          import os
          import sys
          import uuid
          import zlib
          from pathlib import Path

          root = Path(os.environ["ASCEND_PROCESS_LOG_PATH"])
          markers = ("[URMA_SNAPSHOT", "[URMA_CQE", "[ASYNC_WAIT", "[SHUTDOWN_SNAPSHOT", "[STALL")
          printed = 0
          for path in sorted(root.rglob("*.log*")):
              if not path.is_file() or path.is_symlink():
                  continue
              try:
                  opener = gzip.open if path.suffix == ".gz" else open
                  with opener(path, "rt", encoding="utf-8", errors="replace") as stream:
                      contents = stream.read()
              except (OSError, EOFError, zlib.error) as error:
                  print(f"Cannot read A5 device log {path.relative_to(root)}: {error}")
                  continue
              if not any(marker in contents for marker in markers):
                  continue
              boundary = uuid.uuid4().hex
              print(f"::group::A5 device diagnostics: {path.relative_to(root)}", flush=True)
              print(f"::stop-commands::{boundary}", flush=True)
              sys.stdout.write(contents)
              print(f"\n::{boundary}::\n::endgroup::", flush=True)
              printed += 1
          print(f"A5 device diagnostics: printed_files={printed}")
          if printed == 0:
              print(f"No matching A5 device diagnostics under {root}")
          PY

      - name: DFX smokes (a5)
        if: inputs.include_dfx_smokes
        uses: ./.github/actions/run-onboard-dfx-smokes
        with:
          platform: a5

      - name: Retain A5 onboard diagnostic logs
        if: always()
        # Artifact service failures only lose diagnostics; pytest owns the test result.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: a5-onboard-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.A5_DIAGNOSTIC_DIR }}
          if-no-files-found: warn
          retention-days: 7
