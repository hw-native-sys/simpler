name: NPU Scene Tests (a5)

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      repository:
        required: false
        type: string
      ref:
        required: false
        type: string
      runs_on:
        required: true
        type: string
      include_dfx_smokes:
        required: false
        default: false
        type: boolean
      manual_mode:
        description: exclude for Per-PR, include for the Daily full sweep.
        required: false
        default: exclude
        type: string
      session_timeout_seconds:
        description: >-
          Pytest session timeout in seconds. The default sizes the Per-PR
          sweep; a caller that selects more than that sweep has to raise it
          to match what it selected.
        required: false
        default: 1200
        type: number
      job_timeout_minutes:
        description: >-
          Job timeout in minutes. Has to leave room for the whole queue wait
          below, plus setup and the kernel compile that precede it.
        required: false
        default: 75
        type: number

jobs:
  run:
    name: st-onboard-a5
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    timeout-minutes: ${{ inputs.job_timeout_minutes }}
    env:
      MANUAL_MODE: ${{ inputs.manual_mode }}
      SESSION_TIMEOUT_S: ${{ inputs.session_timeout_seconds }}
      SIMPLER_ENABLE_PTO_RDMA_WORKSPACE: "OFF"
      SIMPLER_SCHEDULER_TIMEOUT_MS: "2000"
      SIMPLER_OP_EXECUTE_TIMEOUT_US: "3000000"
      SIMPLER_STREAM_SYNC_TIMEOUT_MS: "6000"
    steps:
      - name: Checkout target
        uses: actions/checkout@v5
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Validate manual mode
        run: |
          case "$MANUAL_MODE" in
            exclude|include|only) ;;
            *)
              echo "::error::manual_mode must be exclude, include, or only"
              exit 2
              ;;
          esac

      - name: Set up environment
        uses: ./.github/actions/setup-venv
        with:
          build-packages: "scikit-build-core nanobind<3 cmake>=3.20"
          packages: "--no-build-isolation --config-settings=build.targets=build_package_a5 .[test]"
          install-torch: "false"
          system-site-packages: "true"
          source-cann: "true"

      - name: Compile scene-test kernels (a5)
        run: |
          source /usr/local/Ascend/cann/set_env.sh
          .venv/bin/python -m simpler_setup.tools.scene_test_compile examples tests/st \
            --platform a5 --exclude-level 4 --require-pto-isa --compile-workers 32 -q \
            --manual "$MANUAL_MODE"

      - name: Compile Qwen standalone kernels (a5)
        if: inputs.manual_mode != 'exclude'
        env:
          TORCH_DEVICE_BACKEND_AUTOLOAD: "0"
        run: |
          source /usr/local/Ascend/cann/set_env.sh
          # discover_runtimes is the one definition of what a runtime is — a
          # directory under src/<arch>/runtime with a build_config.py — so a new
          # one is compiled here without editing this list into existence. An
          # empty result would make the loop body run zero times and the step
          # pass having compiled nothing, which `set -e` does not catch in a
          # `for` list, so it is rejected before the loop.
          runtimes=$(.venv/bin/python -c \
              "from simpler_setup.platform_info import discover_runtimes; print(' '.join(discover_runtimes('a5')))")
          test -n "$runtimes"
          for runtime in $runtimes; do
            .venv/bin/python "examples/a5/$runtime/qwen3_14b_decode/main.py" \
              --platform a5 --compile-only --compile-workers 32
          done

      - name: Run pytest scene tests (a5)
        run: |
          source /usr/local/Ascend/cann/set_env.sh
          # Three nested budgets, each derived from the one it contains, so
          # that raising the sweep does not silently leave an outer one
          # behind:
          #   --max-time  the run itself, which must outlast the session
          #               budget or the device is reclaimed before pytest can
          #               report its own timeout and name what was stuck;
          #   --timeout   how long the client waits, which covers that run
          #               plus the queue ahead of it on a shared pool.
          # At the default these are the 1800 s and 3300 s this job has been
          # using, and the job's own timeout-minutes has to stay above both.
          MAX_TIME_S=$((SESSION_TIMEOUT_S + 600))
          QUEUE_TIMEOUT_S=$((MAX_TIME_S + 1500))
          task-submit --timeout "$QUEUE_TIMEOUT_S" --max-time "$MAX_TIME_S" --device auto --device-num "$DEVICE_NUM" \
            --env SIMPLER_ENABLE_PTO_RDMA_WORKSPACE \
            --run ".venv/bin/python -m pytest examples tests/st --platform a5 --exclude-level 4 --device \$TASK_DEVICE -v --require-pto-isa --pto-session-timeout $SESSION_TIMEOUT_S --manual '$MANUAL_MODE' --environment-receipts --verify-feature-coverage --coverage-partition all --junitxml outputs/default-ci/main.xml"

      - name: DFX smokes (a5)
        if: inputs.include_dfx_smokes
        uses: ./.github/actions/run-onboard-dfx-smokes
        with:
          platform: a5

      - name: Upload HBG argument-dump payloads
        if: always() && inputs.include_dfx_smokes
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: a5-hbg-args-dump-${{ github.run_id }}-${{ github.run_attempt }}-${{ runner.arch }}
          if-no-files-found: ignore
          path: |
            outputs/**/args_dump.json
            outputs/**/args.bin

      - name: Verify and summarize default environment coverage
        if: always()
        run: |
          .venv/bin/python -m simpler_setup.tools.feature_coverage_report \
            --root outputs/default-ci --environment default --platform a5 --manual "$MANUAL_MODE"

      - name: Retain default environment plans and receipts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: default-a5-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: outputs/default-ci
          if-no-files-found: warn
