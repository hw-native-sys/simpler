name: CI Command Status

# Includes native reruns: requested alone does not fire when a run is rerun.
on:
  workflow_dispatch:
    inputs:
      command:
        description: Command that started the run
        type: choice
        options: [a5, a3-network1]
        default: a5
      run_id:
        description: Existing command CI run to reconcile (does not rerun tests)
        type: string
        required: true
      wait_for_completion:
        description: Wait for the notifying CI job to finish before publication
        type: boolean
        default: false
  workflow_run:
    workflows: [CI A5 Comment, CI A3 Network1]
    types: [requested, in_progress, completed]

permissions: {}

env:
  CI_COMMAND: ${{ inputs.command || (github.event.workflow_run.name == 'CI A3 Network1' && 'a3-network1' || 'a5') }}

jobs:
  route:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.event == 'workflow_dispatch' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      key: ${{ steps.route.outputs.key }}
      event: ${{ steps.route.outputs.event }}
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout trusted status router
        uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
          sparse-checkout: |
            .github/scripts
            .github/ci-commands.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Validate origin before joining the status writer queue
        id: route
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/ci_control.py route
      - name: Wait for the notifying CI run to finish
        if: github.event_name == 'workflow_dispatch' && inputs.wait_for_completion
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.run_id }}
        run: |
          # Admission above has validated the source. Do not hold the writer
          # queue while the source finishes its final notification steps.
          for poll in {1..60}; do
            # A transient API failure must not abort the publisher under -e.
            if state=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" --jq .status) &&
               [ "$state" = completed ]; then
              exit 0
            fi
            sleep 5
          done
          echo "Source run did not complete within five minutes" >&2
          exit 1

  publish:
    needs: route
    if: needs.route.outputs.key != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      # Commands and publishers share one writer; queued events cannot replace
      # a pending completion writer. State is re-read after acquiring the slot.
      group: ci-command-status-${{ needs.route.outputs.key }}
      queue: max
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      pull-requests: read
      statuses: write
    steps:
      - name: Checkout trusted status publisher
        uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
          sparse-checkout: |
            .github/scripts
            .github/ci-commands.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Update the PR head's aggregate command status
        env:
          GH_TOKEN: ${{ github.token }}
          CI_ROUTED_EVENT: ${{ needs.route.outputs.event }}
        run: python .github/scripts/ci_control.py publish
