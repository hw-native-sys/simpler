name: Daily Full Scene Tests

permissions:
  contents: read

on:
  schedule:
    - cron: "0 16 * * *"  # 00:00 Beijing
  workflow_dispatch:

concurrency:
  group: daily-full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  st-sim-a2a3:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    uses: ./.github/workflows/_st-sim-a2a3.yml
    with:
      runs_on: ${{ toJSON(matrix.os) }}
      setup_variant: github
      include_dfx_smokes: true
      manual_mode: include
      session_timeout_seconds: 1800
      job_timeout_minutes: 60

  st-sim-a5:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    uses: ./.github/workflows/_st-sim-a5.yml
    with:
      runs_on: ${{ toJSON(matrix.os) }}
      setup_variant: github
      include_dfx_smokes: true
      manual_mode: include
      scheduler_timeout_ms: "60000"
      session_timeout_seconds: 1800
      job_timeout_minutes: 60

  st-framework-eager-a2a3:
    uses: ./.github/workflows/_st-framework-eager.yml
    with:
      platform: a2a3
      runs_on: '["self-hosted","a2a3"]'
      manual_mode: include

  st-framework-eager-a5:
    uses: ./.github/workflows/_st-framework-eager.yml
    with:
      platform: a5
      runs_on: '["self-hosted","a5"]'
      manual_mode: include

  st-vllm-eager-a2a3:
    uses: ./.github/workflows/_st-vllm-eager-a2a3.yml
    with:
      runs_on: '["self-hosted","a2a3"]'
      manual_mode: include
      model_dir: ${{ vars.VLLM_MODEL_DIR }}
      artifact: ${{ vars.VLLM_ARTIFACT }}
      prompt_ids: ${{ vars.VLLM_PROMPT_IDS }}
      adapter_root: ${{ vars.VLLM_ADAPTER_ROOT }}
      atb_env: ${{ vars.VLLM_ATB_ENV }}
      vllm_source_dir: ${{ vars.VLLM_SOURCE_DIR }}
      vllm_ascend_source_dir: ${{ vars.VLLM_ASCEND_SOURCE_DIR }}

  st-onboard-a2a3:
    uses: ./.github/workflows/_st-npu-a2a3.yml
    with:
      runs_on: '["self-hosted","a2a3"]'
      include_dfx_smokes: true
      manual_mode: include

  st-onboard-a5:
    uses: ./.github/workflows/_st-npu-a5.yml
    with:
      runs_on: '["self-hosted","a5"]'
      include_dfx_smokes: true
      manual_mode: include

  st-network1-onboard-a2a3:
    uses: ./.github/workflows/_st-network1.yml
    with:
      platform: a2a3
      # a2a3pod is a label on the runner machines, not a value this repo
      # controls, so it keeps the older word until those machines are
      # relabelled. A job matches every label in this list, so it cannot accept
      # either spelling.
      runs_on: '["self-hosted","Linux","ARM64","a2a3pod"]'
