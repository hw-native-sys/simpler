name: Framework Eager Scene Tests

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      repository:
        required: false
        type: string
      ref:
        required: false
        type: string
      platform:
        required: true
        type: string
      runs_on:
        required: true
        type: string
      manual_mode:
        required: false
        type: string
        default: exclude

jobs:
  run:
    name: st-framework-eager-${{ inputs.platform }}
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    timeout-minutes: 45
    env:
      TORCH_DEVICE_BACKEND_AUTOLOAD: "0"
      SIMPLER_SCHEDULER_TIMEOUT_MS: "2000"
      SIMPLER_OP_EXECUTE_TIMEOUT_US: "3000000"
      SIMPLER_STREAM_SYNC_TIMEOUT_MS: "6000"
    steps:
      - name: Checkout target
        uses: actions/checkout@v5
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Diagnose A3 runner cross-compiler environment
        if: inputs.platform == 'a2a3'
        run: |
          echo "Runner: $RUNNER_NAME on $(hostname)"
          echo "Before CANN: CXXFLAGS=${CXXFLAGS-<unset>}"
          echo "Before CANN: CMAKE_CXX_FLAGS=${CMAKE_CXX_FLAGS-<unset>}"
          cann_env="$(python3 simpler_setup/test_environments.py select torch_npu | awk '/^TEST_ENVIRONMENT_TOOLCHAIN_SELECTED / {print $2}')"
          source "$cann_env"
          echo "After CANN: CXXFLAGS=${CXXFLAGS-<unset>}"
          echo "After CANN: CMAKE_CXX_FLAGS=${CMAKE_CXX_FLAGS-<unset>}"
          command -v cmake
          cmake --version | head -n 1
          command -v ninja
          ninja --version
          compiler="$ASCEND_HOME_PATH/tools/hcc/bin/aarch64-target-linux-gnu-g++"
          "$compiler" --version | head -n 1
          probe="$(mktemp -d)"
          trap 'rm -rf "$probe"' EXIT
          printf 'cmake_minimum_required(VERSION 3.20)\nproject(a3_probe LANGUAGES CXX)\n' > "$probe/CMakeLists.txt"
          if cmake -S "$probe" -B "$probe/inherited" -G Ninja -DCMAKE_CXX_COMPILER="$compiler" -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY; then
            echo "Inherited environment: cross-compiler probe passed"
          else
            echo "Inherited environment: cross-compiler probe failed"
          fi
          if env -u CXXFLAGS -u CMAKE_CXX_FLAGS cmake -S "$probe" -B "$probe/clean" -G Ninja -DCMAKE_CXX_COMPILER="$compiler" -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY; then
            echo "Without compiler flags: cross-compiler probe passed"
          else
            echo "Without compiler flags: cross-compiler probe failed"
          fi

      - name: Set up framework environment
        id: framework
        uses: ./.github/actions/setup-framework-eager
        with:
          platform: ${{ inputs.platform }}

      - name: Run the declared framework environment exclusively
        env:
          CANN_ENV: ${{ steps.framework.outputs.cann_env }}
          MANUAL_MODE: ${{ inputs.manual_mode }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          case "$MANUAL_MODE" in
            exclude|include|only) ;;
            *) echo "::error::manual_mode must be exclude, include, or only"; exit 1 ;;
          esac
          case "$PLATFORM" in
            a2a3|a5) ;;
            *) echo "::error::platform must be a2a3 or a5"; exit 1 ;;
          esac
          source "$CANN_ENV"
          mkdir -p outputs/framework-eager-ci
          git rev-parse HEAD | tee outputs/framework-eager-ci/source.txt
          task-submit --list
          task-submit --env CANN_ENV --env MANUAL_MODE --env PLATFORM --timeout 1200 --max-time 1200 --device auto --device-num 1 \
            --run "source \"\$CANN_ENV\" && .claude/skills/onboard-arch-precheck/check.sh \"\$PLATFORM\" && npu-smi info > outputs/framework-eager-ci/npu-smi.txt && .venv-framework/bin/python .github/actions/setup-framework-eager/identity.py --platform \"\$PLATFORM\" && .venv-framework/bin/python -m pytest examples tests/st --platform \"\$PLATFORM\" --test-environment torch_npu --manual \"\$MANUAL_MODE\" --require-pto-isa --device \$TASK_DEVICE --max-parallel 1 -p no:xdist -v -s --basetemp outputs/framework-eager-ci/pytest --junitxml outputs/framework-eager-ci/results.xml"
          .venv-framework/bin/python -m simpler_setup.test_environments verify outputs/framework-eager-ci/results.plan.json outputs/framework-eager-ci/results.xml

      - name: Retain framework eager identities and logs
        if: always()
        # The test result is already checked above; artifact service failures only lose diagnostics.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: framework-eager-${{ inputs.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            outputs/framework-eager-ci
            !outputs/framework-eager-ci/pytest/framework-eager-module*/**
          if-no-files-found: warn
