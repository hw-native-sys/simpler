name: CI Self CPU
run-name: CI Self CPU / PR ${{ inputs.pr_number || inputs.ref }}

# Emergency lane: T1 no-hardware Linux runs on [self-hosted, cpu], while T3
# NPU jobs run on the a2a3/a5 pools. The lane stays callable from /run-cpu via
# workflow_call and from manual workflow_dispatch. T2 (macOS) is intentionally
# absent. Job bodies live in reusable workflows shared with ci.yml, and only the
# runner/setup inputs differ here; gate outputs come from the canonical reusable
# detect-changes workflow, executed on [self-hosted, cpu] in this lane.
#
# Provisioning contract for the cpu runner (out-of-repo, dnf): every cpu agent
# needs the same set — cmake ninja-build gcc-c++ clang-tools-extra graphviz
# gtest-devel python3-devel. T1 jobs create plain venvs from the runner's
# python3 (the repo supports >=3.9; the runner's 3.9 caught the zip(strict=)
# bug that CI's 3.10 never did) with a pip cache; the venv isolates T1 from
# any system/user python state. T3 (NPU) jobs keep their --system-site-packages
# venvs (driver bindings). g++-15 is a symlink stand-in for the
# ubuntu-toolchain ppa g++ — see below. ci.yml lints with clang-tidy 18 while
# HCE 2.0 packages only LLVM 12, so an agent also provides 18 on PATH under the
# versioned name clang-tidy-18 (installed with its clang builtin headers,
# without which it resolves no resource dir); the pre-commit job shadows the
# distro clang-tidy with it when present.

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      repository:
        description: "Target repo (fork PRs pass fork full name); defaults to this repo."
        required: false
        type: string
      ref:
        description: "PR head SHA or branch to validate. Empty = ref this run was triggered on."
        required: false
        type: string
      pr_number:
        description: "PR number (run naming / concurrency keying)."
        required: false
        type: string
  workflow_dispatch:
    inputs:
      repository:
        description: "Target repo (fork PRs pass fork full name)."
        required: false
        default: hw-native-sys/simpler
        type: string
      ref:
        description: "PR head SHA or branch to validate."
        required: false
        type: string
      pr_number:
        description: "PR number (run naming / concurrency keying)."
        required: false
        type: string

concurrency:
  group: ci-self-cpu-${{ inputs.pr_number || inputs.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    uses: ./.github/workflows/_detect-changes.yml
    with:
      repository: ${{ inputs.repository || github.repository }}
      ref: ${{ inputs.ref || github.sha }}
      base_repository: ${{ github.repository }}
      base_ref: main
      runs_on: '["self-hosted","cpu"]'

  pre-commit:
    uses: ./.github/workflows/_pre-commit.yml
    with:
      repository: ${{ inputs.repository || github.repository }}
      ref: ${{ inputs.ref || github.sha }}
      base_repository: ${{ github.repository }}
      runs_on: '["self-hosted","cpu"]'
      setup_variant: self-cpu

  ut:
    needs: [detect-changes]
    if: needs.detect-changes.outputs.non_code_only != 'true' && needs.detect-changes.outputs.ut_affected == 'true'
    uses: ./.github/workflows/_ut-no-hardware.yml
    with:
      repository: ${{ inputs.repository || github.repository }}
      ref: ${{ inputs.ref || github.sha }}
      runs_on: '["self-hosted","cpu"]'
      setup_variant: self-cpu

  packaging:
    needs: [detect-changes]
    if: needs.detect-changes.outputs.non_code_only != 'true' && needs.detect-changes.outputs.examples_only != 'true' && needs.detect-changes.outputs.tests_only != 'true'
    uses: ./.github/workflows/_packaging.yml
    with:
      repository: ${{ inputs.repository || github.repository }}
      ref: ${{ inputs.ref || github.sha }}
      runs_on: '["self-hosted","cpu"]'
      setup_variant: self-cpu

  profiling-flags-smoke:
    needs: [detect-changes]
    if: (needs.detect-changes.outputs.a2a3_changed == 'true' || needs.detect-changes.outputs.a5_changed == 'true') && needs.detect-changes.outputs.examples_only != 'true' && needs.detect-changes.outputs.tests_only != 'true'
    uses: ./.github/workflows/_profiling-flags-smoke.yml
    with:
      repository: ${{ inputs.repository || github.repository }}
      ref: ${{ inputs.ref || github.sha }}
      runs_on: '["self-hosted","cpu"]'
      setup_variant: self-cpu

  st-sim-a2a3:
    needs: [detect-changes]
    if: needs.detect-changes.outputs.a2a3_changed == 'true' && needs.detect-changes.outputs.st_affected == 'true'
    uses: ./.github/workflows/_st-sim-a2a3.yml
    with:
      repository: ${{ inputs.repository || github.repository }}
      ref: ${{ inputs.ref || github.sha }}
      runs_on: '["self-hosted","cpu"]'
      setup_variant: self-cpu
      include_dfx_smokes: false

  st-sim-a5:
    needs: [detect-changes]
    if: needs.detect-changes.outputs.a5_changed == 'true' && needs.detect-changes.outputs.st_affected == 'true'
    uses: ./.github/workflows/_st-sim-a5.yml
    with:
      repository: ${{ inputs.repository || github.repository }}
      ref: ${{ inputs.ref || github.sha }}
      runs_on: '["self-hosted","cpu"]'
      setup_variant: self-cpu
      include_dfx_smokes: false

  ut-a2a3:
    needs: [detect-changes]
    if: needs.detect-changes.outputs.non_code_only != 'true' && needs.detect-changes.outputs.ut_affected == 'true'
    uses: ./.github/workflows/_ut-npu-a2a3.yml
    with:
      repository: ${{ inputs.repository || github.repository }}
      ref: ${{ inputs.ref || github.sha }}
      runs_on: '["self-hosted","a2a3"]'
      include_cann_examples: false

  st-framework-eager-a2a3:
    needs: [detect-changes, pre-commit]
    if: needs.detect-changes.outputs.a2a3_changed == 'true' && needs.detect-changes.outputs.st_affected == 'true'
    uses: ./.github/workflows/_st-framework-eager.yml
    with:
      platform: a2a3
      repository: ${{ inputs.repository || github.repository }}
      ref: ${{ inputs.ref || github.sha }}
      runs_on: '["self-hosted","a2a3"]'

  st-framework-eager-a5:
    needs: [detect-changes, pre-commit]
    if: needs.detect-changes.outputs.a5_changed == 'true' && needs.detect-changes.outputs.st_affected == 'true'
    uses: ./.github/workflows/_st-framework-eager.yml
    with:
      platform: a5
      repository: ${{ inputs.repository || github.repository }}
      ref: ${{ inputs.ref || github.sha }}
      runs_on: '["self-hosted","a5"]'

  st-onboard-a2a3:
    needs: [detect-changes]
    if: needs.detect-changes.outputs.a2a3_changed == 'true' && needs.detect-changes.outputs.st_affected == 'true'
    uses: ./.github/workflows/_st-npu-a2a3.yml
    with:
      repository: ${{ inputs.repository || github.repository }}
      ref: ${{ inputs.ref || github.sha }}
      runs_on: '["self-hosted","a2a3"]'
      include_dfx_smokes: false

  ut-a5:
    needs: [detect-changes]
    if: needs.detect-changes.outputs.non_code_only != 'true' && needs.detect-changes.outputs.ut_affected == 'true'
    uses: ./.github/workflows/_ut-npu-a5.yml
    with:
      repository: ${{ inputs.repository || github.repository }}
      ref: ${{ inputs.ref || github.sha }}
      runs_on: '["self-hosted","a5"]'
      include_cann_examples: false

  st-onboard-a5:
    needs: [detect-changes]
    if: needs.detect-changes.outputs.a5_changed == 'true' && needs.detect-changes.outputs.st_affected == 'true'
    uses: ./.github/workflows/_st-npu-a5.yml
    with:
      repository: ${{ inputs.repository || github.repository }}
      ref: ${{ inputs.ref || github.sha }}
      runs_on: '["self-hosted","a5"]'
      include_dfx_smokes: false
