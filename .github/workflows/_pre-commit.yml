name: Pre-commit

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      repository:
        description: Repository to checkout.
        required: false
        type: string
      ref:
        description: Ref or SHA to checkout.
        required: false
        type: string
      base_repository:
        description: Canonical base repository for self-cpu diff resolution.
        required: false
        type: string
      base_sha:
        description: Exact base SHA for the admitted PR revision.
        required: false
        type: string
      head_sha:
        description: Exact head SHA for GitHub-hosted PR runs.
        required: false
        type: string
      runs_on:
        description: JSON-encoded runs-on value.
        required: true
        type: string
      setup_variant:
        description: github or self-cpu.
        required: true
        type: string

jobs:
  run:
    name: pre-commit
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    timeout-minutes: 30
    steps:
      - name: Checkout target
        uses: actions/checkout@v5
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 100
          persist-credentials: false

      - name: Checkout Python setup action
        if: inputs.setup_variant == 'github'
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.workflow_sha }}
          path: .ci-support
          sparse-checkout: .github/actions/setup-python
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        if: inputs.setup_variant == 'github'
        uses: ./.ci-support/.github/actions/setup-python
        with:
          python-version: "3.10"

      - name: Verify Python >= 3.10
        run: |
          python3 -c 'import sys; print(sys.version); sys.exit(0 if sys.version_info >= (3, 10) else "CI requires Python >= 3.10")'

      - name: Resolve base SHA
        id: base
        if: inputs.setup_variant == 'self-cpu'
        env:
          BASE_REPOSITORY: ${{ inputs.base_repository || github.repository }}
          BASE_SHA: ${{ inputs.base_sha }}
        run: |
          BASE_URL="https://github.com/${BASE_REPOSITORY}.git"
          BASE="$BASE_SHA"
          if [ -z "$BASE" ]; then
            git fetch --no-tags --depth=100 "$BASE_URL" main
            BASE=$(git rev-parse FETCH_HEAD)
          elif ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=100 "$BASE_URL" "$BASE"
          fi

          HEAD_REV=$(git rev-parse HEAD)
          for deepen in 100 400; do
            if git merge-base "$BASE" "$HEAD_REV" >/dev/null 2>&1; then
              break
            fi
            if [ "$(git rev-parse --is-shallow-repository)" != true ]; then
              break
            fi
            git fetch --no-tags --deepen="$deepen" origin "$HEAD_REV" || break
            git fetch --no-tags --deepen="$deepen" "$BASE_URL" "$BASE" || break
          done

          if ! MERGE_BASE=$(git merge-base "$BASE" "$HEAD_REV"); then
            echo "::error::Cannot resolve the PR merge-base after bounded history fetching"
            exit 1
          fi
          echo "base_sha=$MERGE_BASE" >> "$GITHUB_OUTPUT"

      - name: Select lint build target
        id: lint-build
        env:
          BASE_SHA: ${{ inputs.setup_variant == 'self-cpu' && steps.base.outputs.base_sha || inputs.base_sha }}
          HEAD_SHA: ${{ inputs.setup_variant == 'self-cpu' && (inputs.ref || github.sha) || inputs.head_sha }}
        run: |
          needs_build=false

          changed_files=$(mktemp)
          trap 'rm -f "$changed_files"' EXIT
          if ! git diff --name-only --no-ext-diff -z "$BASE_SHA"..."$HEAD_SHA" > "$changed_files"; then
            git diff --name-only --no-ext-diff -z "$BASE_SHA".."$HEAD_SHA" > "$changed_files"
          fi

          needs_build="$(
            python "$GITHUB_WORKSPACE/tests/lint/clang_tidy_paths.py" --needs-build --null < "$changed_files"
          )"

          echo "needs_build=$needs_build" >> "$GITHUB_OUTPUT"

      - name: Find missing build and lint tools
        id: apt-packages
        if: steps.lint-build.outputs.needs_build == 'true'
        env:
          SETUP_VARIANT: ${{ inputs.setup_variant }}
        run: |
          if [[ "$SETUP_VARIANT" == self-cpu ]] && ! command -v apt-get >/dev/null 2>&1; then
            exit 0
          fi
          missing_packages=()
          command -v cmake >/dev/null 2>&1 || missing_packages+=(cmake)
          command -v ninja >/dev/null 2>&1 || missing_packages+=(ninja-build)
          command -v g++ >/dev/null 2>&1 || missing_packages+=(g++)
          if ! command -v clang-tidy >/dev/null 2>&1 &&
             ! { [[ "$SETUP_VARIANT" == self-cpu ]] && command -v clang-tidy-18 >/dev/null 2>&1; }; then
            missing_packages+=(clang-tidy)
          fi
          echo "required-packages=${missing_packages[*]}" >> "$GITHUB_OUTPUT"

      - name: Install build and lint tools
        if: runner.os == 'Linux' && steps.lint-build.outputs.needs_build == 'true' && steps.apt-packages.outputs.required-packages != ''
        uses: ./.github/actions/apt-install
        with:
          required-packages: ${{ steps.apt-packages.outputs.required-packages }}
          install-timeout-seconds: "240"

      - name: Verify provisioned toolchain
        if: inputs.setup_variant == 'self-cpu' && steps.lint-build.outputs.needs_build == 'true'
        run: |
          command -v cmake
          command -v ninja
          command -v g++
          if ! command -v g++-15 >/dev/null 2>&1; then
            mkdir -p "$RUNNER_TEMP/bin"
            ln -sf "$(command -v g++)" "$RUNNER_TEMP/bin/g++-15"
            echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          fi
          if command -v clang-tidy-18 >/dev/null 2>&1; then
            mkdir -p "$RUNNER_TEMP/bin"
            ln -sf "$(command -v clang-tidy-18)" "$RUNNER_TEMP/bin/clang-tidy"
            echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          fi
          PATH="$RUNNER_TEMP/bin:$PATH" command -v clang-tidy
          PATH="$RUNNER_TEMP/bin:$PATH" clang-tidy --version

      - name: Cache pip packages
        if: inputs.setup_variant == 'github' && steps.lint-build.outputs.needs_build == 'true'
        uses: ./.github/actions/cache-pip

      - name: Install package (for clang-tidy compile databases)
        if: inputs.setup_variant == 'github' && steps.lint-build.outputs.needs_build == 'true'
        run: pip install --config-settings="build.targets=build_package_sim" .

      - name: venv + deps
        if: inputs.setup_variant == 'self-cpu' && steps.lint-build.outputs.needs_build == 'true'
        uses: ./.github/actions/setup-venv
        with:
          install-torch: "false"
          packages: >-
            --config-settings=build.targets=build_package_sim .

      - name: Lint-only venv
        if: inputs.setup_variant == 'self-cpu' && steps.lint-build.outputs.needs_build != 'true'
        run: python3 -m venv .venv

      - name: Use lint venv
        if: inputs.setup_variant == 'self-cpu'
        run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Run pre-commit
        env:
          BASE_SHA: ${{ inputs.setup_variant == 'self-cpu' && steps.base.outputs.base_sha || inputs.base_sha }}
          HEAD_SHA: ${{ inputs.setup_variant == 'self-cpu' && (inputs.ref || github.sha) || inputs.head_sha }}
        run: |
          python -m pip install --retries 5 --timeout 60 "pre-commit==4.5.1"
          python -m pre_commit run --show-diff-on-failure --color=always \
            --from-ref "$BASE_SHA" --to-ref "$HEAD_SHA"
