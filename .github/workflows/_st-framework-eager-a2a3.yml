name: Framework Eager Scene Tests (a2a3)

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      repository:
        required: false
        type: string
      ref:
        required: false
        type: string
      runs_on:
        required: true
        type: string
      manual_mode:
        required: false
        type: string
        default: exclude

jobs:
  run:
    name: st-framework-eager-a2a3
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    timeout-minutes: 45
    env:
      TORCH_DEVICE_BACKEND_AUTOLOAD: "0"
      SIMPLER_SCHEDULER_TIMEOUT_MS: "2000"
      SIMPLER_OP_EXECUTE_TIMEOUT_US: "3000000"
      SIMPLER_STREAM_SYNC_TIMEOUT_MS: "4000"
    steps:
      - name: Checkout target
        uses: actions/checkout@v5
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Set up framework environment
        id: framework
        uses: ./.github/actions/setup-framework-eager

      - name: Run the declared framework environment exclusively
        env:
          CANN_ENV: ${{ steps.framework.outputs.cann_env }}
          MANUAL_MODE: ${{ inputs.manual_mode }}
        run: |
          case "$MANUAL_MODE" in
            exclude|include|only) ;;
            *) echo "::error::manual_mode must be exclude, include, or only"; exit 1 ;;
          esac
          source "$CANN_ENV"
          mkdir -p outputs/framework-eager-ci
          git rev-parse HEAD | tee outputs/framework-eager-ci/source.txt
          task-submit --env CANN_ENV --env MANUAL_MODE --timeout 900 --max-time 900 --device auto --device-num 1 \
            --run "source \"\$CANN_ENV\" && .venv-framework/bin/python .github/actions/setup-framework-eager/identity.py && .venv-framework/bin/python -m pytest examples tests/st --platform a2a3 --test-environment torch_npu --manual \"\$MANUAL_MODE\" --require-pto-isa --device \$TASK_DEVICE --max-parallel 1 -p no:xdist -v -s --basetemp outputs/framework-eager-ci/pytest --junitxml outputs/framework-eager-ci/results.xml"
          .venv-framework/bin/python -m simpler_setup.test_environments verify outputs/framework-eager-ci/results.plan.json outputs/framework-eager-ci/results.xml

      - name: Retain framework eager identities and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: framework-eager-a2a3-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            outputs/framework-eager-ci
            !outputs/framework-eager-ci/pytest/framework-eager-module*/**
          if-no-files-found: warn
