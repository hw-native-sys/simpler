name: NPU Scene Tests (a2a3)

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      repository:
        required: false
        type: string
      ref:
        required: false
        type: string
      runs_on:
        required: true
        type: string
      include_dfx_smokes:
        required: false
        default: false
        type: boolean
      manual_mode:
        description: exclude for Per-PR, include for the Daily full sweep.
        required: false
        default: exclude
        type: string

jobs:
  run:
    name: st-onboard-a2a3
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    timeout-minutes: 60
    env:
      MANUAL_MODE: ${{ inputs.manual_mode }}
      SIMPLER_SCHEDULER_TIMEOUT_MS: "2000"
      SIMPLER_OP_EXECUTE_TIMEOUT_US: "3000000"
      SIMPLER_STREAM_SYNC_TIMEOUT_MS: "4000"
    steps:
      - name: Checkout target
        uses: actions/checkout@v5
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Validate manual mode
        run: |
          case "$MANUAL_MODE" in
            exclude|include|only) ;;
            *)
              echo "::error::manual_mode must be exclude, include, or only"
              exit 2
              ;;
          esac

      - name: Restore scene-test kernel cache (a2a3)
        uses: actions/cache@v5
        with:
          path: build/cache/kernels
          key: scene-kernels-a2a3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pto_isa.pin') }}-${{ inputs.ref || github.sha }}
          restore-keys: |
            scene-kernels-a2a3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pto_isa.pin') }}-

      - name: Set up environment
        uses: ./.github/actions/setup-venv
        with:
          build-packages: "scikit-build-core nanobind<3 cmake>=3.20"
          packages: "--no-build-isolation --config-settings=build.targets=build_package_a2a3 .[test]"
          install-torch: "false"
          system-site-packages: "true"
          source-cann: "true"

      - name: Warn when graphviz is missing
        if: inputs.include_dfx_smokes
        run: |
          if ! command -v dot >/dev/null 2>&1; then
            echo "::warning::graphviz 'dot' not found on PATH; deps_viewer tool smoke will skip. Install graphviz on this self-hosted runner to restore coverage."
          fi

      - name: Compile scene-test kernels (a2a3)
        run: |
          source /usr/local/Ascend/cann/set_env.sh
          .venv/bin/python -m simpler_setup.tools.scene_test_compile examples tests/st \
            --platform a2a3 --exclude-level 4 --require-pto-isa --compile-workers 8 -q \
            --manual "$MANUAL_MODE"

      - name: Compile Qwen standalone kernels (a2a3)
        if: inputs.manual_mode != 'exclude'
        env:
          TORCH_DEVICE_BACKEND_AUTOLOAD: "0"
        run: |
          source /usr/local/Ascend/cann/set_env.sh
          # discover_runtimes is the one definition of what a runtime is — a
          # directory under src/<arch>/runtime with a build_config.py — so a new
          # one is compiled here without editing this list into existence. An
          # empty result would make the loop body run zero times and the step
          # pass having compiled nothing, which `set -e` does not catch in a
          # `for` list, so it is rejected before the loop.
          runtimes=$(.venv/bin/python -c \
              "from simpler_setup.platform_info import discover_runtimes; print(' '.join(discover_runtimes('a2a3')))")
          test -n "$runtimes"
          for runtime in $runtimes; do
            .venv/bin/python "examples/a2a3/$runtime/qwen3_14b_decode/main.py" \
              --platform a2a3 --compile-only --compile-workers 8
          done

      - name: Run pytest scene tests (a2a3)
        run: |
          source /usr/local/Ascend/cann/set_env.sh
          task-submit --timeout 1800 --max-time 1800 --device auto --device-num "$DEVICE_NUM" \
            --run ".venv/bin/python -m pytest examples tests/st -m 'not sdma' --platform a2a3 --exclude-level 4 --device \$TASK_DEVICE -v --require-pto-isa --pto-session-timeout 1200 --manual '$MANUAL_MODE'"

      - name: SDMA pytest (a2a3)
        if: inputs.manual_mode != 'only'
        run: |
          source /usr/local/Ascend/cann/set_env.sh
          SDMA_TESTS="examples tests/st -m sdma"
          task-submit --timeout 1800 --max-time 1800 --device auto --device-num 2 \
            --run ".venv/bin/python -m pytest $SDMA_TESTS --platform a2a3 --device \$TASK_DEVICE -v --require-pto-isa --pto-session-timeout 600"

      - name: DFX smokes (a2a3)
        if: inputs.include_dfx_smokes
        uses: ./.github/actions/run-onboard-dfx-smokes
        with:
          platform: a2a3
