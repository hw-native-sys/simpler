name: NPU Model Tests (a2a3)

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      repository:
        required: false
        type: string
      ref:
        required: false
        type: string
      runs_on:
        required: true
        type: string

jobs:
  run:
    name: st-model-onboard-a2a3
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    timeout-minutes: 40
    env:
      SIMPLER_SCHEDULER_TIMEOUT_MS: "10000"
      SIMPLER_OP_EXECUTE_TIMEOUT_US: "45000000"
      SIMPLER_STREAM_SYNC_TIMEOUT_MS: "50000"
    steps:
      - name: Checkout target
        uses: actions/checkout@v5
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Set up environment
        uses: ./.github/actions/setup-venv
        with:
          build-packages: "scikit-build-core nanobind<3 cmake>=3.20"
          packages: "--no-build-isolation --config-settings=build.targets=build_package_a2a3 .[test]"
          install-torch: "false"
          system-site-packages: "true"
          source-cann: "true"

      - name: Compile DeepSeek kernels (a2a3)
        run: |
          source /usr/local/Ascend/cann/set_env.sh
          # discover_runtimes is the one definition of what a runtime is — a
          # directory under src/<arch>/runtime with a build_config.py — so a new
          # one is compiled here without editing this list into existence. An
          # empty result would make the loop body run zero times and the step
          # pass having compiled nothing, which `set -e` does not catch in a
          # `for` list, so it is rejected before the loop.
          runtimes=$(.venv/bin/python -c \
              "from simpler_setup.platform_info import discover_runtimes; print(' '.join(discover_runtimes('a2a3')))")
          test -n "$runtimes"
          for runtime in $runtimes; do
            .venv/bin/python "examples/a2a3/$runtime/deepseek_v4_flash_decode/main.py" \
              --platform a2a3 --compile-only --compile-workers 64
          done

      - name: Compile Qwen standalone kernels (a2a3)
        env:
          TORCH_DEVICE_BACKEND_AUTOLOAD: "0"
        run: |
          source /usr/local/Ascend/cann/set_env.sh
          runtimes=$(.venv/bin/python -c \
              "from simpler_setup.platform_info import discover_runtimes; print(' '.join(discover_runtimes('a2a3')))")
          test -n "$runtimes"
          for runtime in $runtimes; do
            .venv/bin/python "examples/a2a3/$runtime/qwen3_14b_decode/main.py" \
              --platform a2a3 --compile-only --compile-workers 32
          done

      # Qwen uses the default golden path; only the DeepSeek wrappers set
      # skip_golden=True. Each Qwen case needs one device and each DS case two;
      # the pytest scheduler fits the four manual cases into four devices.
      # Qwen fixture generation, CPU golden computation and comparison are
      # inside the allocation; the drivers also check the precompiled cache.
      - name: Run Qwen and DeepSeek pytest tests (a2a3)
        env:
          TORCH_DEVICE_BACKEND_AUTOLOAD: "0"
        run: |
          source /usr/local/Ascend/cann/set_env.sh
          MODEL_TESTS=(
            examples/a2a3/host_build_graph/qwen3_14b_decode
            examples/a2a3/tensormap_and_ringbuffer/qwen3_14b_decode
            examples/a2a3/host_build_graph/deepseek_v4_flash_decode
            examples/a2a3/tensormap_and_ringbuffer/deepseek_v4_flash_decode
          )
          task-submit --env OMP_NUM_THREADS=16 --env MKL_NUM_THREADS=16 \
            --timeout 1800 --max-time 1800 --device auto --device-num 4 \
            --run ".venv/bin/python -m pytest ${MODEL_TESTS[*]} -m 'not sdma' --platform a2a3 --exclude-level 4 --manual only --device \$TASK_DEVICE -v --require-pto-isa --pto-session-timeout 1200"
