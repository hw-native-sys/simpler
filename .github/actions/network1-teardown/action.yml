name: Clear the network1 staging tree
description: >-
  Remove the peer tree only after both owned reservations have retired and their
  logs have been copied. Unknown ownership retains the tree for diagnosis.

runs:
  using: composite
  steps:
    - shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        set -euo pipefail
        # network1-stage may never have run, so assume nothing.
        [ -n "${REMOTE_WORKDIR:-}" ] || exit 0
        [ -r "${NETWORK1_SSH_HELPER:-}" ] || exit 0
        if [ ! -r "$RUN_DIR/reservations/cleanup.json" ] || ! python3 -c \
          'import json,sys; sys.exit(not json.load(open(sys.argv[1]))["complete"])' \
          "$RUN_DIR/reservations/cleanup.json"; then
          echo "::error::network1 retirement unproved; retaining peer tree $REMOTE_WORKDIR"
          exit 1
        fi
        source "$NETWORK1_SSH_HELPER"
        if [ -n "${NETWORK1_MPI_PYTHON:-}" ]; then
          rm -f "$NETWORK1_MPI_PYTHON"
          network1_ssh "rm -f '$NETWORK1_MPI_PYTHON'"
        fi
        network1_ssh "rm -rf '$REMOTE_WORKDIR'"
