name: Set up venv
description: Create .venv and install Python dependencies.

inputs:
  build-packages:
    description: Packages installed before the main pip invocation, such as scikit-build-core and nanobind.
    required: false
    default: ""
  packages:
    description: Arguments passed to pip install after torch, for example ".[test]" or "-e .[test]".
    required: false
    default: ""
  toolchain-bundle:
    description: Source the preinstalled PyPTO toolchain before creating the venv.
    required: false
    default: "false"
  install-torch:
    description: Install the CPU torch wheel before packages.
    required: false
    default: "true"
  system-site-packages:
    description: Create the venv with --system-site-packages.
    required: false
    default: "false"
  source-cann:
    description: Source the CANN environment before creating the venv.
    required: false
    default: "false"
  cann-env:
    description: >-
      Which CANN environment script source-cann sources. The network1 runners carry
      theirs in their own .env, so the path cannot be fixed here.
    required: false
    default: /usr/local/Ascend/cann/set_env.sh
  http-proxy:
    description: >-
      Proxy for pip only, never exported job-wide — a runner that already
      reaches its index directly must not be routed through an untested hop.
      Empty keeps whatever the runner's own environment already says.
    required: false
    default: ""
  https-proxy:
    description: >-
      Proxy for pip only. Empty keeps the runner's own setting.
    required: false
    default: ""
  no-proxy:
    description: >-
      Hosts pip reaches without the proxy. Empty keeps the runner's own setting.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Create venv and install dependencies
      shell: bash
      env:
        BUILD_PACKAGES: ${{ inputs.build-packages }}
        PACKAGES: ${{ inputs.packages }}
        CANN_ENV: ${{ inputs.cann-env }}
        IN_HTTP_PROXY: ${{ inputs.http-proxy }}
        IN_HTTPS_PROXY: ${{ inputs.https-proxy }}
        IN_NO_PROXY: ${{ inputs.no-proxy }}
        USE_TOOLCHAIN_BUNDLE: ${{ inputs.toolchain-bundle }}
      run: |
        set -f
        if [ "${{ inputs.source-cann }}" = "true" ]; then
          source "$CANN_ENV"
        fi
        if [ "$USE_TOOLCHAIN_BUNDLE" = "true" ]; then
          source /opt/pypto/toolchain/current/activate.sh
          test -n "$PYPTO_TOOLCHAIN"
          printf '%s\n' "$PYPTO_TOOLCHAIN/bin" "$PYPTO_TOOLCHAIN/gcc/bin" "$PYPTO_TOOLCHAIN/python/bin" >> "$GITHUB_PATH"
          printf 'LD_LIBRARY_PATH=%s\n' "$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
          printf 'PYPTO_TOOLCHAIN=%s\n' "$PYPTO_TOOLCHAIN" >> "$GITHUB_ENV"
          python3 --version
        fi

        # Only the network1 workflow passes these; every other caller runs on a
        # machine whose own environment already says how to reach an index.
        # Exporting an empty input would erase that setting, so an unset input
        # leaves the runner's environment untouched rather than forcing direct.
        [ -z "$IN_HTTP_PROXY" ] || export http_proxy="$IN_HTTP_PROXY" HTTP_PROXY="$IN_HTTP_PROXY"
        [ -z "$IN_HTTPS_PROXY" ] || export https_proxy="$IN_HTTPS_PROXY" HTTPS_PROXY="$IN_HTTPS_PROXY"
        [ -z "$IN_NO_PROXY" ] || export no_proxy="$IN_NO_PROXY" NO_PROXY="$IN_NO_PROXY"

        VENV_ARGS=()
        if [ "${{ inputs.system-site-packages }}" = "true" ]; then
          VENV_ARGS+=(--system-site-packages)
        fi

        python3 -m venv "${VENV_ARGS[@]}" .venv
        source .venv/bin/activate
        pip install --upgrade pip
        if [ "${{ inputs.install-torch }}" = "true" ]; then
          pip install torch --index-url https://download.pytorch.org/whl/cpu
        fi
        if [ -n "$BUILD_PACKAGES" ]; then
          pip install $BUILD_PACKAGES
        fi
        if [ -n "$PACKAGES" ]; then
          pip install $PACKAGES
        fi
