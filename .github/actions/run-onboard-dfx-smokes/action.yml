name: Run onboard DFX smokes
description: Run the per-feature DFX smoke suites across the allocated devices.

inputs:
  platform:
    description: Onboard platform, either a2a3 or a5.
    required: true
  cann-env:
    description: CANN environment setup script.
    required: false
    default: /usr/local/Ascend/cann/set_env.sh

runs:
  using: composite
  steps:
    - name: Run ${{ inputs.platform }} DFX smokes
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        CANN_ENV: ${{ inputs.cann-env }}
        DFX_PLATFORM: ${{ inputs.platform }}
      run: |
        set -euo pipefail

        case "$DFX_PLATFORM" in
          a2a3|a5)
            source "$CANN_ENV"
            ;;
          *)
            echo "::error::unsupported onboard platform: $DFX_PLATFORM"
            exit 2
            ;;
        esac
        source .venv/bin/activate
        evidence_dir="$PWD/outputs/onboard-dfx-ci/$DFX_PLATFORM"
        mkdir -p "$evidence_dir"
        python -c '
        import hashlib, json, os, pathlib, subprocess, sys
        import _task_interface as native
        source = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
        assert native.__build_commit__ == source, (native.__build_commit__, source)
        platform = os.environ["DFX_PLATFORM"]
        paths = pathlib.Path("build/lib", platform, "onboard")
        files = [path for path in paths.glob("*/*") if path.name in ("libhost_runtime.so", "libaicpu_kernel.so", "aicore_kernel.o")]
        print(json.dumps({"source": source, "native": native.__build_commit__, "platform": platform,
                          "python": sys.version, "cann_env": str(pathlib.Path(os.environ["CANN_ENV"]).resolve()),
                          "cann_home": os.environ.get("ASCEND_HOME_PATH"),
                          "runtime_sha256": {str(path): hashlib.sha256(path.read_bytes()).hexdigest() for path in files}}, indent=2))
        ' > "$evidence_dir/identity.json"

        DRIVER="$RUNNER_TEMP/run-onboard-dfx-smokes-${DFX_PLATFORM}.sh"
        trap 'rm -f "$DRIVER"' EXIT
        cat > "$DRIVER" <<'DFX_DRIVER'
        set -uo pipefail

        platform=$1
        device_list=${2//[[:space:]]/}
        IFS=',' read -r -a devices <<< "$device_list"
        if [[ -z "$device_list" ]] || [[ ${#devices[@]} -eq 0 ]]; then
          echo "DFX smokes require at least one device" >&2
          exit 2
        fi

        declare -a seen_devices=()
        for device in "${devices[@]}"; do
          if [[ ! "$device" =~ ^[0-9]+$ ]] || [[ -n "${seen_devices[$device]:-}" ]]; then
            echo "DFX smokes require distinct numeric device ids, got: $device_list" >&2
            exit 2
          fi
          seen_devices[$device]=1
        done

        evidence_dir="$PWD/outputs/onboard-dfx-ci/$platform"
        log_dir="$evidence_dir/logs"
        mkdir -p "$log_dir"
        declare -a job_labels=()
        declare -a job_pids=()
        declare -a job_logs=()
        declare -a job_rcs=()
        declare -a job_devices=()
        declare -a active_device_jobs=()

        cleanup_children() {
          local pid
          for pid in "${job_pids[@]}"; do
            if [[ -n "$pid" ]] && kill -0 "$pid" 2>/dev/null; then
              kill "$pid" 2>/dev/null || true
            fi
          done
          for pid in "${job_pids[@]}"; do
            if [[ -n "$pid" ]]; then
              wait "$pid" 2>/dev/null || true
            fi
          done
        }

        trap 'cleanup_children; exit 130' INT
        trap 'cleanup_children; exit 143' TERM HUP

        sample_inventory() {
          local phase=$1
          printf '%s\n' "$device_list" > "$evidence_dir/allocated-devices.txt"
          # Keep queue ownership, never other users' command strings.
          task-submit --list 2>&1 | awk '/^=== / || /^  (占用|空闲)/ {print}' > "$evidence_dir/queue-$phase.txt"
          printf '%s\n' "${PIPESTATUS[0]}" > "$evidence_dir/queue-$phase.exit"
          if npu-smi info > "$evidence_dir/npu-$phase.txt" 2>&1; then
            echo 0 > "$evidence_dir/npu-$phase.exit"
          else
            printf '%s\n' "$?" > "$evidence_dir/npu-$phase.exit"
            # This query-only retry takes no device or lock.
            task-submit --run "npu-smi info" > "$evidence_dir/npu-$phase-privileged.txt" 2>&1
            printf '%s\n' "$?" > "$evidence_dir/npu-$phase-privileged.exit"
          fi
        }

        sample_inventory before

        emit_failure_excerpt() {
          python -c '
        import pathlib, re, sys
        root, index = pathlib.Path(sys.argv[1]), sys.argv[2]
        pattern = re.compile(rb"error|failure|failed|timeout|error_site", re.IGNORECASE)
        groups = ((root.parent / "failed", "*.log"), (root / "ascend" / index, "*.log"))
        print("DFX first-error excerpt: bounded retained windows, not a complete log", flush=True)
        for directory, glob in groups:
            for path in sorted(directory.rglob(glob))[:4]:
                try:
                    size = path.stat().st_size
                    start = max(0, size - 4 * 1024 * 1024)
                    with path.open("rb") as stream:
                        stream.seek(start)
                        body = stream.read(4 * 1024 * 1024)
                    match = pattern.search(body)
                    offset = max(0, match.start() - 1024) if match else max(0, len(body) - 16384)
                    excerpt = body[offset:offset + 16384]
                    print(f"file={path.relative_to(root.parent)} source_bytes={size} offset={start + offset} excerpt_bytes={len(excerpt)}", flush=True)
                    print(excerpt.decode("utf-8", errors="replace"), flush=True)
                except OSError as error:
                    print(f"Excerpt unavailable: {path.name}: {str(error)[:256]}", flush=True)
        ' "$evidence_dir" "$1" || echo "DFX failure excerpt unavailable"
        }

        start_job() {
          local label=$1
          shift

          local index=${#job_labels[@]}
          local device=${devices[$((index % ${#devices[@]}))]}
          local active_index=${active_device_jobs[$device]:-}
          if [[ -n "$active_index" ]]; then
            wait_job "$active_index"
          fi

          local log_file="$log_dir/$index.log"
          mkdir -p "$evidence_dir/ascend/$index"
          job_labels+=("$label")
          job_logs+=("$log_file")
          job_rcs+=(-1)
          job_devices+=("$device")

          echo "Starting $label on device $device"
          ASCEND_PROCESS_LOG_PATH="$evidence_dir/ascend/$index" \
          python -m pytest "$@" \
            --platform "$platform" --device "$device" -p no:xdist \
            --pto-session-timeout 600 --require-pto-isa \
            --basetemp "$evidence_dir/pytest/$index" >"$log_file" 2>&1 &
          job_pids+=("$!")
          active_device_jobs[$device]=$index
        }

        wait_job() {
          local index=$1
          local pid=${job_pids[$index]}
          if [[ ${job_rcs[$index]} -ne -1 ]]; then
            return
          fi

          if wait "$pid"; then
            job_rcs[$index]=0
          else
            job_rcs[$index]=$?
          fi
          job_pids[$index]=""
        }

        if [[ "$platform" == "a2a3" ]]; then
          start_job "dep_gen (tensormap_and_ringbuffer)" \
            tests/st/a2a3/tensormap_and_ringbuffer/dfx/dep_gen/test_dep_gen.py \
            --enable-dep-gen
        else
          start_job "dep_gen" \
            tests/st/a5/tensormap_and_ringbuffer/dfx/dep_gen/test_dep_gen.py \
            --enable-dep-gen
        fi

        start_job "chip_swimlane" \
          "tests/st/$platform/tensormap_and_ringbuffer/dfx/chip_swimlane/" \
          --enable-chip-swimlane --enable-dep-gen

        if [[ "$platform" == "a5" ]]; then
          start_job "chip_swimlane (host_build_graph)" \
            tests/st/a5/host_build_graph/dfx/chip_swimlane/test_scheduler_phases.py::TestConsecutiveClockAlignment::test_run \
            --manual include --enable-chip-swimlane 4
        fi

        start_job "PMU" \
          "tests/st/$platform/tensormap_and_ringbuffer/dfx/pmu/test_pmu.py" \
          --enable-pmu 2

        # A second PMU job, and the only one that can see a counting window
        # stop. The smoke above runs microsecond-scale tasks, where the loss
        # this covers appears too rarely for a pass to mean anything; this one
        # holds a core for ~0.9 s and asserts per row. `--manual include`
        # because the case is manual so the ordinary sweep, which passes no
        # --enable-pmu, does not spend its spin with every assertion skipped.
        # a2a3 only: the suite exists there.
        if [[ "$platform" == "a2a3" ]]; then
          start_job "PMU counting window (host_build_graph)" \
            "tests/st/a2a3/host_build_graph/dfx/pmu/" \
            --manual include --enable-pmu 2
        fi

        # Mode "full" here; see the mode-per-lane rationale in _st-sim-a2a3.yml.
        # This action runs for both a2a3 and a5 onboard, so full -- the only
        # mode that ignores the Arg::dump() masks and writes payload for every
        # arg -- is the one that gets hardware coverage on both architectures.
        # The sim lanes take partial and hybrid.
        # No backticks in this comment: the heredoc above is quoted today, but
        # they would become command substitution if it were ever unquoted.
        start_job "args_dump (full)" \
          "tests/st/$platform/tensormap_and_ringbuffer/dfx/args_dump/test_args_dump.py" \
          --dump-args full

        if [[ "$platform" == "a5" ]]; then
          for mode in full hybrid partial; do
            start_job "args_dump resident Program ($mode)" \
              tests/st/a5/host_build_graph/dump_args/test_dump_args_example.py \
              --runtime host_build_graph --dump-args "$mode"
          done
          start_job "args_dump resident Mix (full)" \
            tests/st/a5/host_build_graph/single_block_mix/test_single_block_mix.py \
            --runtime host_build_graph --dump-args full
        fi

        # The directory, not a named file: every case here needs --enable-dep-gen
        # to assert anything, so one this job does not select reports a pass
        # having checked no graph. Both arches have a host-built dep_gen suite,
        # so neither is branched on.
        start_job "dep_gen (host_build_graph)" \
          "tests/st/$platform/host_build_graph/dfx/dep_gen/" \
          --enable-dep-gen

        for index in "${!job_labels[@]}"; do
          wait_job "$index"
        done
        sample_inventory after

        failed=0
        : > "$evidence_dir/status.tsv"
        for index in "${!job_labels[@]}"; do
          label=${job_labels[$index]}
          rc=${job_rcs[$index]}
          printf '%s\t%s\t%s\t%s\n' "$index" "${job_devices[$index]}" "$rc" "$label" >> "$evidence_dir/status.tsv"
          echo "::group::DFX $label (exit=$rc)"
          cat "${job_logs[$index]}"
          echo "::endgroup::"
          if [[ $rc -ne 0 ]]; then
            emit_failure_excerpt "$index"
            echo "::error title=DFX smoke failed::$label failed on ${platform} device ${job_devices[$index]} with exit code $rc"
            failed=1
          fi
        done

        exit "$failed"
        DFX_DRIVER

        if [[ "$DFX_PLATFORM" == "a2a3" ]]; then
          task-submit --timeout 1800 --max-time 1800 --device auto --device-num "$DEVICE_NUM" \
            --run "bash '$DRIVER' a2a3 \$TASK_DEVICE" | tee "$evidence_dir/task-client.log"
        else
          task-submit --timeout 1800 --max-time 1800 --device auto --device-num "$DEVICE_NUM" \
            --run "bash '$DRIVER' a5 \$TASK_DEVICE" | tee "$evidence_dir/task-client.log"
        fi
