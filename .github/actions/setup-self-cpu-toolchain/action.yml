name: Set up self-hosted CPU toolchain
description: Select a provisioned Python 3.10 and GCC 15 toolchain on CPU runners.

runs:
  using: composite
  steps:
    - name: Activate toolchain bundle
      shell: bash
      run: |
        set -euo pipefail
        bundle=${SIMPLER_CPU_TOOLCHAIN_ACTIVATE:-/opt/pypto/toolchain/current/activate.sh}
        if [ -f "$bundle" ]; then
          source "$bundle"
          if [ -n "${PYPTO_TOOLCHAIN:-}" ]; then
            printf '%s\n' "$PYPTO_TOOLCHAIN/bin" "$PYPTO_TOOLCHAIN/gcc/bin" "$PYPTO_TOOLCHAIN/python/bin" >> "$GITHUB_PATH"
            printf 'PYPTO_TOOLCHAIN=%s\nLD_LIBRARY_PATH=%s\n' "$PYPTO_TOOLCHAIN" "$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
          fi
        else
          echo "Using the runner's installed Python and C++ toolchain"
        fi
        python3 -c 'import sys; assert sys.version_info[:2] == (3, 10), sys.version'
        command -v g++-15
        python3 -c 'import ctypes; ctypes.CDLL("libatomic.so.1")'
