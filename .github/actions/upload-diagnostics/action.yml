name: Upload diagnostics
description: Load the artifact uploader when the diagnostic retention step runs.

inputs:
  name:
    description: Artifact name.
    required: true
  path:
    description: Files, directories, or patterns to upload.
    required: true
  if-no-files-found:
    description: Behavior when no matching files exist.
    required: false
    default: warn
  retention-days:
    description: Days to retain the artifact; empty uses the repository default.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Upload diagnostic files
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        retention-days: ${{ inputs.retention-days }}
