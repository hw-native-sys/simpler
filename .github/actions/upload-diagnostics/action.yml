name: Upload diagnostics
description: Load the artifact uploader when the diagnostic retention step runs.

inputs:
  name:
    description: Artifact name.
    required: true
  path:
    description: Files, directories, or patterns to upload.
    required: true
  if-no-files-found:
    description: Behavior when no matching files exist.
    required: false
    default: warn
  retention-days:
    description: Days to retain the artifact; empty uses the repository default.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Upload diagnostic files
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.name }}
        # Capture manifests and their payloads describe the failed execution.
        # Only build products are excluded; @actions/glob applies these
        # negations after the caller's paths.
        path: |
          ${{ inputs.path }}
          !**/objects/**
          !**/CMakeFiles/**
          !**/*.o
          !**/*.so
          !**/*.a
          !**/*.pyc
          !**/__pycache__/**
          !**/build.ninja
          !**/.ninja_deps
          !**/.ninja_log
        if-no-files-found: ${{ inputs.if-no-files-found }}
        retention-days: ${{ inputs.retention-days }}
