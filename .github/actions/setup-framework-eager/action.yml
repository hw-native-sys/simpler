name: Framework setup entry point for default-branch callers
description: Delegate the existing comment-workflow action path to the framework environment setup.

inputs:
  platform:
    description: Canonical onboard platform (a2a3 or a5).
    required: false
    default: a2a3

outputs:
  cann_env:
    description: Environment script for the selected CANN toolkit.
    value: ${{ steps.setup.outputs.cann_env }}

runs:
  using: composite
  steps:
    - id: setup
      uses: ./.github/actions/setup-framework
      with:
        platform: ${{ inputs.platform }}
