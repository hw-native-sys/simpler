name: Run network1 pytest across the pair
description: >-
  Reserve both hosts through task-submit, run the peer daemon and local pytest,
  drain owned processes, and retain queue, device, process and failure logs.

inputs:
  pytest-args:
    description: Arguments passed to `python -m pytest`.
    required: true

runs:
  using: composite
  steps:
    - name: Reserve both hosts and run network1 pytest
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        PYTEST_ARGS: ${{ inputs.pytest-args }}
      run: |
        set -euo pipefail
        python3 .github/actions/network1-run-pytest/run.py run

    - name: Confirm retirement and collect peer logs
      if: always()
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        set -euo pipefail
        python3 .github/actions/network1-run-pytest/run.py cleanup
