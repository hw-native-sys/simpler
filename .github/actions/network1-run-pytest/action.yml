name: Run network1 pytest across the pair
description: Submit the peer daemon and local pytest through task-submit, then collect logs.

inputs:
  pytest-args:
    description: Arguments passed to `python -m pytest`.
    required: true

runs:
  using: composite
  steps:
    - name: Run network1 pytest on task-submit devices
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        PYTEST_ARGS: ${{ inputs.pytest-args }}
      run: |
        set -euo pipefail
        source "$NETWORK1_SSH_HELPER"
        mkdir -p "$RUN_DIR/pytest/local-task"
        deadline=$(( $(cat "$RUNNER_TEMP/network1-job-start") + 3600 - 90 ))
        remaining=$(( deadline - $(date +%s) ))
        (( remaining > 0 )) || { echo 'network1 job time expired before task submission' >&2; exit 1; }
        quote() { printf '%q' "$1"; }
        port_open() { timeout 1 bash -c 'exec 3<>/dev/tcp/$1/$2' _ "$REMOTE_DAEMON_HOST" "$NETWORK1_L3_DAEMON_PORT" 2>/dev/null; }
        if port_open; then
          echo 'network1 remote daemon port is already in use' >&2
          exit 1
        fi

        remote_logs="$REMOTE_WORKDIR/output/network1-ci/pytest/remote-task"
        remote_marker="$REMOTE_WORKDIR/output/network1-ci/remote-task.env"
        remote_body=$(cat <<TASK
        set -eo pipefail
        : network1-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-remote
        cd $(quote "$REMOTE_WORKDIR")
        source $(quote "$NETWORK1_REMOTE_CANN_ENV")
        source .venv/bin/activate
        export PYTHONPATH='' CMAKE_PREFIX_PATH=''
        export SIMPLER_SCHEDULER_TIMEOUT_MS=$(quote "$SIMPLER_SCHEDULER_TIMEOUT_MS")
        export SIMPLER_OP_EXECUTE_TIMEOUT_US=$(quote "$SIMPLER_OP_EXECUTE_TIMEOUT_US")
        export SIMPLER_STREAM_SYNC_TIMEOUT_MS=$(quote "$SIMPLER_STREAM_SYNC_TIMEOUT_MS")
        export ASCEND_PROCESS_LOG_PATH=$(quote "$REMOTE_WORKDIR/output/network1-ci/pytest/daemon-${NETWORK1_REMOTE_MACHINE}")
        mkdir -p $(quote "$remote_logs") "\$ASCEND_PROCESS_LOG_PATH"
        [ "\$(date +%s)" -lt $deadline ] || exit 124
        printf 'export TASKQUEUE_TASK_ID=%q\nexport TASKQUEUE_INSIDE=%q\nexport TASK_DEVICE=%q\nexport NPU_LOCKED_DEVICE=%q\n' "\$TASKQUEUE_TASK_ID" "\${TASKQUEUE_INSIDE:-}" "\$TASK_DEVICE" "\${NPU_LOCKED_DEVICE:-}" > $(quote "$remote_marker")
        npu-smi info > $(quote "$remote_logs/before.log") 2>&1 || true
        exec python -m simpler.remote_l3_worker --host $(quote "$REMOTE_DAEMON_HOST") --port $(quote "$NETWORK1_L3_DAEMON_PORT") > $(quote "$remote_logs/work.log") 2>&1
        TASK
        )
        printf -v remote_command 'bash -lc %q' "$remote_body"
        [[ "$remote_command" != *$'\n'* ]]
        remote_id=$(network1_ssh "task-submit --device $(quote "$NETWORK1_REMOTE_DEVICES") --max-time $remaining $(quote "$remote_command")")
        [[ "$remote_id" =~ ^task_[0-9_]+$ ]] || { echo "invalid remote task ID: $remote_id" >&2; exit 1; }
        printf '%s\n' "$remote_id" > "$RUN_DIR/remote-task-id"
        echo "network1 remote task: $remote_id"

        while :; do
          status=$(network1_ssh "task-submit --status $remote_id")
          case "$status" in
            running) break ;;
            pending) ;;
            *) echo "remote task exited before device grant: $status" >&2; exit 1 ;;
          esac
          (( $(date +%s) < deadline )) || { echo 'remote device queue exceeded job time' >&2; exit 1; }
          sleep 2
        done
        ready_by=$(( $(date +%s) + NETWORK1_DAEMON_WAIT_S ))
        while ! port_open; do
          status=$(network1_ssh "task-submit --status $remote_id")
          [[ "$status" == running ]] || { echo "remote daemon exited before readiness: $status" >&2; exit 1; }
          (( $(date +%s) < ready_by && $(date +%s) < deadline )) || { echo 'remote daemon did not become ready' >&2; exit 1; }
          sleep 2
        done
        status=$(network1_ssh "task-submit --status $remote_id")
        [[ "$status" == running ]] || { echo "remote daemon exited before pytest: $status" >&2; exit 1; }

        remaining=$(( deadline - $(date +%s) ))
        (( remaining > 0 )) || { echo 'no time remains for local pytest' >&2; exit 1; }
        local_body=$(cat <<TASK
        set -eo pipefail
        : network1-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-local
        cd $(quote "$GITHUB_WORKSPACE")
        source $(quote "$NETWORK1_CANN_ENV")
        source .venv/bin/activate
        export PYTHONPATH='' CMAKE_PREFIX_PATH=''
        export SIMPLER_SCHEDULER_TIMEOUT_MS=$(quote "$SIMPLER_SCHEDULER_TIMEOUT_MS")
        export SIMPLER_OP_EXECUTE_TIMEOUT_US=$(quote "$SIMPLER_OP_EXECUTE_TIMEOUT_US")
        export SIMPLER_STREAM_SYNC_TIMEOUT_MS=$(quote "$SIMPLER_STREAM_SYNC_TIMEOUT_MS")
        export NETWORK1_REMOTE_ENDPOINT=$(quote "$REMOTE_DAEMON_HOST:$NETWORK1_L3_DAEMON_PORT")
        left=\$(( $deadline - \$(date +%s) ))
        (( left > 0 )) || exit 124
        printf 'export TASKQUEUE_TASK_ID=%q\nexport TASKQUEUE_INSIDE=%q\nexport TASK_DEVICE=%q\nexport NPU_LOCKED_DEVICE=%q\n' "\$TASKQUEUE_TASK_ID" "\${TASKQUEUE_INSIDE:-}" "\$TASK_DEVICE" "\${NPU_LOCKED_DEVICE:-}" > $(quote "$RUN_DIR/local-task.env")
        npu-smi info > $(quote "$RUN_DIR/pytest/local-task/before.log") 2>&1 || true
        timeout --signal=TERM --kill-after=10s "\${left}s" python -m pytest $PYTEST_ARGS > $(quote "$RUN_DIR/pytest/local-task/work.log") 2>&1
        TASK
        )
        printf -v local_command 'bash -lc %q' "$local_body"
        [[ "$local_command" != *$'\n'* ]]
        local_id=$(task-submit --device "$NETWORK1_LOCAL_DEVICES" --max-time "$remaining" "$local_command")
        [[ "$local_id" =~ ^task_[0-9_]+$ ]] || { echo "invalid local task ID: $local_id" >&2; exit 1; }
        printf '%s\n' "$local_id" > "$RUN_DIR/local-task-id"
        echo "network1 local task: $local_id"

        while :; do
          status=$(task-submit --status "$local_id")
          if [[ "$status" =~ ^completed\ \(exit=([0-9]+)\)$ ]]; then
            exit "${BASH_REMATCH[1]}"
          fi
          [[ "$status" == pending || "$status" == running ]] || { echo "local task: $status" >&2; exit 1; }
          peer_status=$(network1_ssh "task-submit --status $remote_id")
          [[ "$peer_status" == running ]] || { echo "remote daemon exited during pytest: $peer_status" >&2; exit 1; }
          (( $(date +%s) < deadline )) || { echo 'network1 job time expired' >&2; exit 1; }
          sleep 2
        done

    - name: Stop tasks and collect peer logs
      if: always()
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        set -uo pipefail
        [ -n "${RUN_DIR:-}" ] && [ -r "${NETWORK1_SSH_HELPER:-}" ] || exit 0
        source "$NETWORK1_SSH_HELPER"
        taskctl() {
          local side=$1
          shift
          if [ "$side" = remote ]; then
            network1_ssh "task-submit $(printf '%q ' "$@")"
          else
            task-submit "$@"
          fi
        }
        complete=true
        any_task=false
        for side in local remote; do
          id_file="$RUN_DIR/$side-task-id"
          if [ -r "$id_file" ]; then
            task_id=$(cat "$id_file")
          else
            task_id=$(taskctl "$side" --find "network1-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$side") || complete=false
            if [[ "$task_id" =~ ^task_[0-9_]+$ ]]; then
              printf '%s\n' "$task_id" > "$id_file"
            fi
          fi
          [ -n "${task_id:-}" ] || continue
          any_task=true
          if [[ ! "$task_id" =~ ^task_[0-9_]+$ ]]; then complete=false; continue; fi
          status=$(taskctl "$side" --status "$task_id") || { complete=false; continue; }
          cancelled=false
          if [ "$status" = pending ]; then
            taskctl "$side" --cancel "$task_id" || true
            cancelled=true
            status=$(taskctl "$side" --status "$task_id") || { complete=false; continue; }
          fi
          if [ "$status" = running ]; then taskctl "$side" --kill "$task_id" || true; fi
          until=$(( $(date +%s) + 25 ))
          while :; do
            status=$(taskctl "$side" --status "$task_id") || { complete=false; break; }
            if [[ "$status" == completed\ \(exit=* ]] || { [ "$status" = not_found ] && $cancelled; }; then break; fi
            if (( $(date +%s) >= until )); then complete=false; break; fi
            sleep 2
          done
          echo "network1 $side task $task_id: $status"
          taskctl "$side" --log "$task_id" || true
        done
        if $any_task && network1_ssh "test -d '$REMOTE_WORKDIR/output/network1-ci'"; then
          mkdir -p "$RUN_DIR/peer"
          rsync -a -e "$RSYNC_SSH" "$REMOTE_TARGET:$REMOTE_WORKDIR/output/network1-ci/" "$RUN_DIR/peer/" || complete=false
        fi
        if $complete; then
          printf '{"complete":true}\n' > "$RUN_DIR/cleanup.json"
        else
          printf '{"complete":false}\n' > "$RUN_DIR/cleanup.json"
          echo 'network1 task cleanup or log collection is unproved; retaining peer tree' >&2
          exit 1
        fi
